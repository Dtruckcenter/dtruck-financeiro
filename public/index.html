function genPass(){const a='abcdefghjkmnpqrstuvwxyz',A='ABCDEFGHJKLMNPQRSTUVWXYZ',d='23456789';const r=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
  const pick=s=>s[r(s.length)];let p=pick(A)+pick(a)+pick(a)+pick(a)+'-'+pick(d)+pick(d)+pick(d)+pick(d)+'-'+pick(A)+pick(a)+pick(a)+pick(a);return p}
function showAuth(mode){
  const logo=document.querySelector('.brand .logo').src;
  const T={
    login:{h:'Entrar',p:'Use o e-mail e a senha cadastrados pelo administrador.',f:`<div class="f"><label for="a-email">E-mail</label><input id="a-email" name="email" type="email" autocomplete="username" required></div>
      <div class="f"><label for="a-pass">Senha</label><input id="a-pass" name="password" type="password" autocomplete="current-password" required></div>`,b:'Entrar',
      foot:'Esqueceu a senha? Peça ao administrador para redefinir.'},
    setup:{h:'Primeiro acesso',p:'Crie a conta do administrador do sistema. Use o e-mail autorizado da Dtruck.',f:`<div class="f"><label for="a-name">Seu nome</label><input id="a-name" name="name" autocomplete="name" required></div>
      <div class="f"><label for="a-email">E-mail</label><input id="a-email" name="email" type="email" autocomplete="username" required></div>
      <div class="f"><label for="a-pass">Crie uma senha</label><input id="a-pass" name="password" type="password" autocomplete="new-password" required></div>
      <div class="f"><label for="a-pass2">Repita a senha</label><input id="a-pass2" name="password2" type="password" autocomplete="new-password" required></div>
      <p>Mínimo de 8 caracteres, com letras e números.</p>`,b:'Criar conta e entrar',foot:''},
    change:{h:'Defina sua senha',p:'Sua senha atual é provisória. Crie uma senha pessoal para continuar.',f:`<div class="f"><label for="a-cur">Senha provisória</label><input id="a-cur" name="current" type="password" autocomplete="current-password" required></div>
      <div class="f"><label for="a-pass">Nova senha</label><input id="a-pass" name="password" type="password" autocomplete="new-password" required></div>
      <div class="f"><label for="a-pass2">Repita a nova senha</label><input id="a-pass2" name="password2" type="password" autocomplete="new-password" required></div>
      <p>Mínimo de 8 caracteres, com letras e números.</p>`,b:'Salvar e entrar',foot:'<a href="#" id="a-out" style="color:inherit">Sair</a>'}
  }[mode];
  $('#auth-root').innerHTML=`<div class="auth"><div class="auth-wrap"><img src="${logo}" alt="Dtruck Center"><form class="auth-card" id="auth-form" novalidate><h2>${T.h}</h2><p>${T.p}</p><div class="auth-err" id="a-err" hidden></div>${T.f}<button class="btn pri" type="submit">${T.b}</button></form><div class="auth-foot">${T.foot}</div></div></div>`;
  const out=$('#a-out');if(out)out.onclick=async e=>{e.preventDefault();try{await DtruckAPI.logout()}catch(_){}location.reload()};
  const err=m=>{const el=$('#a-err');el.textContent=m;el.hidden=false};
  const f=$('#auth-form');f.querySelector('input').focus();
  f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const btn=f.querySelector('[type=submit]');
    if(d.password2!==undefined&&d.password!==d.password2)return err('As senhas não são iguais.');
    btn.disabled=true;
    try{
      if(mode==='login'){const r=await DtruckAPI.login(d.email,d.password);if(r&&r.mustChange){btn.disabled=false;return showAuth('change')}}
      else if(mode==='setup')await DtruckAPI.setup(d.email,d.name,d.password);
      else await DtruckAPI.changePassword(d.current,d.password);
      location.reload();
    }catch(x){btn.disabled=false;err(x.message||'Não foi possível entrar. Tente de novo.')}
  };
}
function myPassword(){
  openModal(`<h2>Alterar minha senha</h2><div class="form"><div class="f w6"><label for="mp-c">Senha atual</label><input id="mp-c" name="current" type="password" autocomplete="current-password"></div>
    <div class="f w6"><label for="mp-n">Nova senha</label><input id="mp-n" name="password" type="password" autocomplete="new-password"></div>
    <div class="f w6"><label for="mp-n2">Repita a nova senha</label><input id="mp-n2" name="password2" type="password" autocomplete="new-password"></div>
    <p class="hint f w6">Mínimo de 8 caracteres, com letras e números. Você continua conectado neste aparelho; os outros aparelhos serão desconectados.</p></div>
    <div class="mfoot"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri">Salvar nova senha</button></div>`,
  async d=>{if(d.password!==d.password2){toast('As senhas não são iguais.');return false}
    try{await DtruckAPI.changePassword(d.current,d.password);toast('Senha alterada');}catch(e){toast(e.message||'Não foi possível alterar a senha.');return false}});
}
const MODS=[['painel','Painel',1],['orcamentos','Orçamentos'],['pagar','Contas a pagar'],['receber','Contas a receber'],['os','Ordens de serviço'],['lancamentos','Entradas e saídas'],['notas','Importar notas'],['fluxo','Fluxo de caixa',1],['dre','DRE',1],['clientes','Clientes'],['pecas','Produtos'],['entrada','Entrada de mercadoria'],['laudos','Laudos']];
const PRESETS={tudo:Object.fromEntries(MODS.map(([k,,v])=>[k,v?'ver':'editar'])),consulta:Object.fromEntries(MODS.map(([k])=>[k,'ver'])),
  estoque:{pecas:'editar',entrada:'editar',notas:'ver'},financeiro:{painel:'ver',orcamentos:'editar',pagar:'editar',receber:'editar',os:'ver',lancamentos:'editar',fluxo:'ver',dre:'ver',clientes:'ver'},oficina:{orcamentos:'editar',os:'editar',laudos:'editar',clientes:'editar',pecas:'ver'}};
function can(mod,lvl='ver'){const me=DtruckAPI.me&&DtruckAPI.me();if(!me)return false;if(me.role==='admin')return true;if(mod==='usuarios'||mod==='config')return false;const P=me.perms||{};
  if(mod==='painel'&&lvl==='editar')return P.lancamentos==='editar';
  const v=P[mod];if(mod==='notas'&&P.entrada==='editar')return true;return lvl==='editar'?v==='editar':!!v}
function resumoPerms(u){if(u.role==='admin')return '<span class="pill in">Administrador</span>';const p=u.perms||{};
  const ed=MODS.filter(([k])=>p[k]==='editar').map(([,l])=>l), ve=MODS.filter(([k])=>p[k]==='ver').map(([,l])=>l);
  return `${ed.length?`<div><b>Edita:</b> ${ed.join(', ')}</div>`:''}${ve.length?`<div class="hint"><b>Só vê:</b> ${ve.join(', ')}</div>`:''}${!ed.length&&!ve.length?'<span class="muted">Nenhum módulo</span>':''}`}
UI.users=null;
async function loadUsers(){try{UI.users=(await DtruckAPI.users.list()).users}catch(e){UI.users=[];toast(e.message||'Não foi possível carregar os usuários.')}if(UI.view==='usuarios')render()}
function vUsuarios(){
  const me=DtruckAPI.me()||{};
  if(me.role!=='admin')return '<div class="panel empty">Só administradores gerenciam usuários.</div>';
  if(!UI.users){loadUsers();return '<div class="loading">Carregando usuários…</div>'}
  const L=UI.users;
  return `<div class="head"><div><h1>Usuários e permissões</h1><p class="sub">Cadastre quem pode entrar no sistema e escolha, módulo por módulo, o que cada pessoa pode ver ou alterar.</p></div><div class="tools"><button class="btn pri" data-act="user-new">+ Novo usuário</button></div></div>
  <div class="tw"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Permissões</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead><tbody>
  ${L.map(u=>`<tr class="${u.active?'':'off'}"><td><b>${esc(u.name)||'—'}</b>${u.email===me.email?' <span class="pill info">você</span>':''}</td><td>${esc(u.email)}</td><td style="min-width:240px;font-size:13px">${resumoPerms(u)}</td>
    <td>${!u.active?'<span class="pill late">Desativado</span>':u.mustChange?'<span class="pill pend">Senha provisória</span>':'<span class="pill ok">Ativo</span>'}</td>
    <td>${u.lastLogin?new Date(u.lastLogin).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'Nunca entrou'}</td>
    <td><div class="act"><button class="btn sm ghost" data-act="user-edit" data-id="${esc(u.email)}">Editar permissões</button><button class="btn sm ghost" data-act="user-reset" data-id="${esc(u.email)}">Redefinir senha</button>${u.email!==me.email?`<button class="btn sm ghost danger" data-act="user-del" data-id="${esc(u.email)}">Excluir</button>`:''}</div></td></tr>`).join('')}
  </tbody></table></div>
  <div class="panel" style="margin-top:16px"><h2>Como funcionam as permissões</h2><p class="hint" style="margin:0"><b>Administrador</b> faz tudo, inclusive cadastrar usuários, saldo inicial e CNPJ. Para os demais, cada módulo pode ficar <b>sem acesso</b> (nem aparece no menu), <b>ver</b> (consulta, sem alterar) ou <b>editar</b>. Quem não tem acesso a um módulo também não recebe os dados dele.</p></div>`;
}
function showTempPass(email,pass){
  openModal(`<h2>Senha provisória</h2><p>Passe esta senha para <b>${esc(email)}</b>. No primeiro acesso, o sistema vai pedir para a pessoa criar uma senha pessoal.</p><div class="pwd-show" id="tp">${esc(pass)}</div>
    <p class="hint">Ela não aparece de novo depois que você fechar esta janela.</p><div class="mfoot"><button type="button" class="btn" id="tp-copy">Copiar</button><button type="submit" class="btn pri">Fechar</button></div>`,async()=>{},
    ()=>{$('#tp-copy').onclick=()=>{navigator.clipboard.writeText(pass).then(()=>toast('Senha copiada'),()=>{const r=document.createRange();r.selectNodeContents($('#tp'));getSelection().removeAllRanges();getSelection().addRange(r)})}});
}
function userForm(u){
  const isNew=!u, me=DtruckAPI.me()||{};u=u||{role:'usuario',active:true,perms:PRESETS.financeiro};
  const pass=isNew?genPass():'', p=u.role==='admin'?PRESETS.tudo:(u.perms||{});
  const grid=MODS.map(([k,l,so])=>`<tr><td>${l}</td>${['','ver','editar'].map(v=>`<td style="text-align:center">${so&&v==='editar'?'<span class="muted">—</span>':`<input type="radio" name="perm_${k}" value="${v}" ${(p[k]||'')===v?'checked':''} aria-label="${l}: ${v||'sem acesso'}">`}</td>`).join('')}</tr>`).join('');
  openModal(`<h2>${isNew?'Novo usuário':'Editar usuário'}</h2><div class="form">
    <div class="f w6"><label for="u-name">Nome</label><input id="u-name" name="name" value="${esc(u.name)}" required></div>
    <div class="f w4"><label for="u-email">E-mail</label><input id="u-email" name="email" type="email" value="${esc(u.email)}" ${isNew?'':'disabled'} required></div>
    ${isNew?`<div class="f w2"><label for="u-pass">Senha provisória</label><input id="u-pass" name="password" value="${pass}"></div>`:`<div class="f w2"><label class="check" style="margin-top:22px"><input type="checkbox" name="active" ${u.active?'checked':''} ${u.email===me.email?'disabled':''}> Acesso ativo</label></div>`}
    <div class="f w6"><label class="check"><input type="checkbox" name="admin" id="u-admin" ${u.role==='admin'?'checked':''} ${u.email===me.email?'disabled':''}> <b>Administrador</b>: acesso total, inclusive cadastrar usuários</label></div>
    <div class="f w6" id="u-perms" ${u.role==='admin'?'hidden':''}>
      <label>Permissões por módulo</label>
      <div class="tools" style="margin:4px 0 8px"><span class="hint">Atalhos:</span><button type="button" class="btn sm" data-preset="financeiro">Financeiro</button><button type="button" class="btn sm" data-preset="estoque">Estoque</button><button type="button" class="btn sm" data-preset="oficina">Oficina</button><button type="button" class="btn sm" data-preset="consulta">Só consulta</button><button type="button" class="btn sm" data-preset="tudo">Tudo (sem usuários)</button><button type="button" class="btn sm ghost" data-preset="nada">Limpar</button></div>
      <div class="tw"><table><thead><tr><th>Módulo</th><th style="text-align:center">Sem acesso</th><th style="text-align:center">Ver</th><th style="text-align:center">Editar</th></tr></thead><tbody>${grid}</tbody></table></div>
    </div>
  </div><div class="mfoot"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri">${isNew?'Criar usuário':'Salvar'}</button></div>`,
  async d=>{
    const admin=u.email===me.email?true:!!d.admin;
    const perms=Object.fromEntries(MODS.map(([k])=>[k,d['perm_'+k]||'']));
    if(!admin&&!Object.values(perms).some(Boolean)){toast('Marque pelo menos um módulo para este usuário.');return false}
    try{
      if(isNew){await DtruckAPI.users.create({name:d.name,email:d.email,role:admin?'admin':'usuario',perms,password:d.password});UI.users=null;render();setTimeout(()=>showTempPass(d.email,d.password),50)}
      else{const upd={name:d.name,role:admin?'admin':'usuario',perms};if(u.email!==me.email)upd.active=!!d.active;await DtruckAPI.users.update(u.email,upd);toast('Usuário atualizado');UI.users=null;render()}
    }catch(e){toast(e.message||'Não foi possível salvar.');return false}},
  f=>{$('#u-admin').onchange=e=>{$('#u-perms').hidden=e.target.checked};
    f.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const P=b.dataset.preset==='nada'?{}:PRESETS[b.dataset.preset];MODS.forEach(([k])=>{const v=P[k]||'';const r=f.querySelector(`input[name="perm_${k}"][value="${v}"]`)||f.querySelector(`input[name="perm_${k}"][value="ver"]`);if(r)r.checked=true})})});
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id;
  switch(b.dataset.act){
    case 'logout':(async()=>{try{await DtruckAPI.logout()}catch(_){}location.hash='';location.reload()})();break;
    case 'my-pass':myPassword();break;
    case 'tema':{const i=TEMAS.indexOf(temaAtual());aplicarTema(TEMAS[(i+1)%TEMAS.length]);toast('Tema: '+TEMA_NOME[temaAtual()]);break}
    case 'user-new':userForm(null);break;
    case 'user-edit':userForm(UI.users.find(u=>u.email===id));break;
    case 'user-reset':{const p=genPass();confirmBox('Redefinir senha',`Criar uma senha provisória nova para <b>${esc(id)}</b>? A pessoa será desconectada e terá que criar uma senha pessoal no próximo acesso.`,'Redefinir',async()=>{
      try{await DtruckAPI.users.update(id,{password:p});UI.users=null;render();setTimeout(()=>showTempPass(id,p),50)}catch(e){toast(e.message||'Não foi possível redefinir.')}});break}
    case 'user-del':confirmBox('Excluir usuário',`Excluir o acesso de <b>${esc(id)}</b>? Os lançamentos feitos por essa pessoa continuam no sistema.`,'Excluir',async()=>{
      try{await DtruckAPI.users.remove(id);toast('Usuário excluído');UI.users=null;render()}catch(e){toast(e.message||'Não foi possível excluir.')}});break;
  }
});

// ---------- Ações ----------
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id;
  switch(b.dataset.act){
    case 'new-lanc': return lancForm({tipo:b.dataset.tipo,categoria:b.dataset.tipo==='entrada'?'venda_pecas':'compra_pecas',pago:true,forma:'PIX'});
    case 'edit-lanc': return lancForm(S.lancs.find(l=>l.id===id));
    case 'del-lanc': {const l=S.lancs.find(x=>x.id===id);return confirmBox('Excluir lançamento',`Excluir “${esc(l.descricao)}” de ${fmt(l.valor)}?${stockEffect(l)?' O estoque do produto será revertido.':''}`,'Excluir',async()=>{
      const ch={};const a=stockEffect(l);if(a)ch[a.id]=-a.d;await guard((async()=>{await S.db.doc('lancamentos/'+id).delete();await applyStock(ch)})(),'Lançamento excluído')})}
    case 'pay': {const l=S.lancs.find(x=>x.id===id);return openModal(`<h2>${l.tipo==='entrada'?'Registrar recebimento':'Registrar pagamento'}</h2><p>${esc(l.descricao)} · <b>${fmt(l.valor)}</b> · vencimento ${fmtD(l.data)}</p><div class="form"><div class="f"><label for="pg-d">Data</label><input id="pg-d" type="date" name="d" value="${today}"></div><div class="f"><label for="pg-f">Forma</label><select id="pg-f" name="f">${FORMAS.map(f=>`<option ${l.forma===f?'selected':''}>${f}</option>`).join('')}</select></div></div><div class="mfoot"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri">Confirmar</button></div>`,
      async fd=>guard(S.db.doc('lancamentos/'+id).update({pago:true,dataPagamento:fd.d||today,forma:fd.f}),l.tipo==='entrada'?'Recebimento registrado':'Pagamento registrado'))}
    case 'imp-me': {const v=digits($('#imp-me').value);if(v.length!==14&&v.length!==11)return toast('Digite um CNPJ com 14 dígitos.');UI.imp.me=v;UI.imp.guessed=false;UI.imp.meNome='';reclassify();return render()}
    case 'imp-run': return runImport();
    case 'imp-cancel': UI.imp=null;return render();
    case 'imp-undo': {const n=S.notas.find(x=>x.id===id);if(!n)return;const pagos=(n.lancIds||[]).filter(i=>S.lancs.find(l=>l.id===i)?.pago).length;
      return confirmBox('Desfazer importação',`Remover a ${esc(n.modelo)} ${esc(n.numero)} (${esc(n.contraparte)}, ${fmt(n.valor)}) e os ${(n.lancIds||[]).length} lançamento(s) criados por ela?${pagos?` <b>${pagos} já está(ão) marcado(s) como pago(s).</b>`:''}${(n.itens||[]).some(i=>i.delta)?' O estoque dos produtos volta ao que era antes.':''} Clientes e produtos cadastrados continuam.`,'Desfazer',async()=>{await guard(undoNota(n),'Importação desfeita')})}
    case 'new-cli': return cliForm({});
    case 'edit-cli': return cliForm(S.clientes.find(c=>c.id===id));
    case 'del-cli': {const c=S.clientes.find(x=>x.id===id);const n=S.lancs.filter(l=>l.clienteId===id).length;return confirmBox('Excluir cliente',`Excluir <b>${esc(c.nome)}</b>?${n?` Os ${n} lançamento(s) dele continuam no financeiro, sem o nome do cliente.`:''}`,'Excluir',async()=>{await guard(S.db.doc('clientes/'+id).delete(),'Cliente excluído')})}
    case 'new-peca': return pecaForm({});
    case 'edit-peca': return pecaForm(S.pecas.find(p=>p.id===id));
    case 'del-peca': {const p=S.pecas.find(x=>x.id===id);return confirmBox('Excluir produto',`Excluir <b>${esc(p.codigo)} · ${esc(p.descricao)}</b> do catálogo? Os lançamentos ligados a ela continuam no financeiro.`,'Excluir',async()=>{await guard(S.db.doc('pecas/'+id).delete(),'Produto excluído')})}
    case 'saldo-ini': return openModal(`<h2>Saldo inicial de caixa</h2><p class="hint">Quanto havia em caixa e bancos antes do primeiro lançamento registrado aqui.</p><div class="form"><div class="f w6"><label for="si">Saldo inicial (R$)</label><input id="si" name="v" type="number" step="0.01" value="${S.config.saldoInicial||0}"></div></div><div class="mfoot"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri">Salvar</button></div>`,
      async fd=>guard(S.db.doc('config/geral').set({...S.config,saldoInicial:r2(+fd.v||0),exemplo:false}),'Saldo inicial atualizado'));
    case 'clear-ex': return confirmBox('Apagar dados de exemplo','Isso remove todos os clientes, produtos e lançamentos marcados como exemplo. Os registros que você criou continuam.','Apagar exemplos',async()=>{
      const all=[...S.lancs.filter(x=>x.exemplo).map(x=>'lancamentos/'+x.id),...S.clientes.filter(x=>x.exemplo).map(x=>'clientes/'+x.id),...S.pecas.filter(x=>x.exemplo).map(x=>'pecas/'+x.id)];
      await guard((async()=>{for(const p of all)await S.db.doc(p).delete();if(S.config.exemplo)await S.db.doc('config/geral').set({...S.config,saldoInicial:0,exemplo:false})})(),'Dados de exemplo apagados')});
  }
});
document.addEventListener('change',e=>{if(e.target.id==='pm'&&e.target.value){UI.mes=e.target.value;saveUI();render()}});

// ---------- Rotas ----------
const EDIT_ACTS=['new-lanc','edit-lanc','del-lanc','pay','unpay','ct-batch','new-conta','new-cli','edit-cli','del-cli','new-peca','edit-peca','del-peca','imp-run','imp-undo','ent-dar','saldo-ini','clear-ex'];
function primeiraTela(){return ['painel','orcamentos','pagar','receber','os','lancamentos','entrada','pecas','clientes','laudos','notas','fluxo','dre'].find(v=>can(v))||'painel'}
function aplicarPermissoes(){document.querySelectorAll('#menu a[data-v]').forEach(a=>{a.hidden=!can(a.dataset.v)});
  document.querySelectorAll('#menu .navgrp').forEach(g=>{g.hidden=![...g.querySelectorAll('a[data-v]')].some(a=>!a.hidden)})}
// grupos do menu que abrem e fecham (lembra a escolha neste navegador)
UI.nav=(()=>{try{return JSON.parse(localStorage.getItem('dtruck-nav')||'{}')}catch(e){return {}}})();
function aplicarGrupos(){document.querySelectorAll('#menu .navgrp').forEach(g=>{const ativo=!!g.querySelector('a.on');const fechado=UI.nav[g.dataset.g]===false&&!ativo;g.classList.toggle('closed',fechado);g.querySelector('.grp-t').setAttribute('aria-expanded',String(!fechado));
})}
document.addEventListener('click',e=>{const t=e.target.closest('.grp-t');if(!t)return;const g=t.closest('.navgrp');const abrir=g.classList.contains('closed');UI.nav[g.dataset.g]=abrir;g.classList.toggle('closed',!abrir);t.setAttribute('aria-expanded',String(abrir));try{localStorage.setItem('dtruck-nav',JSON.stringify(UI.nav))}catch(x){}});
function route(){let h=location.hash.slice(1);if(h==='config'){UI.cfg.num=null;UI.cfg.dirty=false}
  // ao sair de uma OS ou laudo sem alterações pendentes, a tela volta para a lista
  if(h!=='os'&&UI.os&&UI.os.edit&&!UI.os.dirty)UI.os.edit=null;if(h!=='laudos'&&UI.laudo&&UI.laudo.edit&&!UI.laudo.dirty)UI.laudo.edit=null;if(h!=='orcamentos'&&UI.orc&&UI.orc.edit&&!UI.orc.dirty)UI.orc.edit=null;if(S.db&&VIEWS[h]&&!can(h)){h=primeiraTela();history.replaceState(null,'','#'+h)}UI.view=VIEWS[h]?h:(S.db?primeiraTela():'painel');if(h==='usuarios')UI.users=null;render();window.scrollTo(0,0);if(S.db&&window.DtruckAPI)DtruckAPI.sync().catch(()=>{})}
window.addEventListener('hashchange',route);

// ---------- Boot ----------
let rtimer;
const certBusy=()=>{const f=$('#cert-file'),box=$('#cert-box');return !!(f&&(f.files.length||$('#cert-pass').value||(box&&box.contains(document.activeElement))))};
const editando=()=>(UI.view==='orcamentos'&&UI.orc&&UI.orc.edit)||(UI.view==='os'&&UI.os&&UI.os.edit)||(UI.view==='laudos'&&UI.laudo&&UI.laudo.edit)||(UI.view==='config'&&UI.cfg&&UI.cfg.dirty);
function rerender(){clearTimeout(rtimer);rtimer=setTimeout(()=>{if(!$('#ov')&&!certBusy()&&!editando())render();else if(!editando())pendingRender=true},40)}
let pendingRender=false;
new MutationObserver(()=>{if(pendingRender&&!$('#ov')){pendingRender=false;render()}}).observe($('#modal-root'),{childList:true});
(async()=>{
  UI.view=VIEWS[location.hash.slice(1)]?location.hash.slice(1):'painel';
  document.querySelectorAll('#menu a').forEach(a=>a.classList.toggle('on',a.dataset.v===UI.view));
  let db;
  try{db=await DtruckAPI.init()}catch(e){
    if(e&&e.code==='unauthenticated'){let st={};try{st=await DtruckAPI.setupStatus()}catch(_){}return showAuth(st.needsSetup?'setup':'login')}
    if(e&&e.code==='must_change')return showAuth('change');
    S.noDb=e&&e.message?e.message:'Verifique sua conexão.';render();return}
  const who=DtruckAPI.me();
  if(who){
    $('#railfoot').innerHTML=`Conectado como<br><b style="color:#fff;word-break:break-all">${esc(who.name||who.email)}</b><br>${who.role==='admin'?'Administrador':'Usuário'}<div class="acts"><button type="button" data-act="my-pass">Alterar senha</button><button type="button" data-act="logout">Sair</button><button type="button" class="tema" data-act="tema" id="tema-btn"></button></div>`;temaRotulos();
    aplicarPermissoes();$('#nav-users').hidden=who.role!=='admin';$('#nav-config').hidden=who.role!=='admin';
    if(!can(UI.view)){UI.view=primeiraTela();history.replaceState(null,'','#'+UI.view)}}
  S.db=db;
  const to=setTimeout(()=>{const l=$('#ld');if(l)l.textContent='Os dados estão demorando para chegar. Verifique sua conexão; a página atualiza sozinha quando responder.'},10000);
  const map=d=>({id:d.id,...d.data()});
  const sub=(col,key,flag)=>db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(map);S.ready[flag]=1;if(S.ready.c&&S.ready.p&&S.ready.l)clearTimeout(to);rerender()},err=>{console.error(err);S.ready[flag]=1;rerender()});
  sub('clientes','clientes','c');sub('pecas','pecas','p');sub('lancamentos','lancs','l');sub('notas','notas','n');
  for(const [col,key] of [['dfe','dfe'],['dfefila','dfefila'],['sys','sys'],['os','os'],['laudos','laudos'],['orcamentos','orcamentos']])db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(map);rerender()},()=>{});
  db.collection('categorias').onSnapshot(s=>{S.categorias=s.docs.map(map);rebuildCats();rerender()},()=>{});
  db.doc('config/geral').onSnapshot(s=>{S.config=s.exists?s.data():{saldoInicial:0};rerender()},()=>{});
})();
</script>

</body>
</html>
