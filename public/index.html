<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dtruck Financeiro</title>
<script>try{var t=localStorage.getItem("dt-tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: identidade Dtruck Center — trilho lateral azul escuro com a logo, área de trabalho cinza azulado, azul Dtruck como destaque; Open Sans em tudo */
:root{
  --bg:#EAF3F8; --surface:#FFFFFF; --surface-2:#F3F8FB; --ink:#0B2035; --muted:#4F6577; --line:#D3E2EC;
  --rail:#0B2035; --rail-ink:#C8D8E4; --rail-mute:#7F97AB;
  --accent:#18A8EE; --accent-ink:#0B2035; --accent-soft:#DDF1FC; --accent-text:#0A7FC0;
  --pos:#178048; --pos-soft:#E1F3E8; --neg:#C2392B; --neg-soft:#FBE5E2; --warn:#9A6400; --warn-soft:#FFF0D4;
  --f-display:"Open Sans",Arial,system-ui,sans-serif;
  --f-body:"Open Sans",Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Open Sans",Arial,system-ui,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#071624; --surface:#0E2234; --surface-2:#132B40; --ink:#E6F0F7; --muted:#8FA8BB; --line:#1E3A52;
  --rail:#050F1A; --rail-ink:#C8D8E4; --rail-mute:#6F8AA0;
  --accent:#18A8EE; --accent-ink:#04121F; --accent-soft:#0E3653; --accent-text:#5CC4F5;
  --pos:#4CC47F; --pos-soft:#123222; --neg:#F0735E; --neg-soft:#3A1C17; --warn:#F0B04A; --warn-soft:#352812;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071624; --surface:#0E2234; --surface-2:#132B40; --ink:#E6F0F7; --muted:#8FA8BB; --line:#1E3A52;
  --rail:#050F1A; --rail-ink:#C8D8E4; --rail-mute:#6F8AA0;
  --accent:#18A8EE; --accent-ink:#04121F; --accent-soft:#0E3653; --accent-text:#5CC4F5;
  --pos:#4CC47F; --pos-soft:#123222; --neg:#F0735E; --neg-soft:#3A1C17; --warn:#F0B04A; --warn-soft:#352812;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.brand .logo{width:150px;height:auto;display:block}
.brand .sym{display:none;width:34px;height:auto}
.brand small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rail-mute);font-weight:600}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu a{color:var(--rail-ink);text-decoration:none;padding:9px 12px;border-radius:4px;font-weight:500;display:flex;align-items:center;gap:10px;border-left:3px solid transparent}
nav.menu a:hover{background:rgba(255,255,255,.05)}
nav.menu a.on{background:rgba(24,168,238,.14);border-left-color:var(--accent);color:#fff}
nav.menu .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rail-mute);padding:14px 12px 4px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--rail-mute)}
main{min-width:0;padding-block:24px 48px;padding-left:max(16px,2.2vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.2vw)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0 0 12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(.96)}
.btn.danger{color:var(--neg)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:400 14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:60px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-mono);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .note{font-size:13px;color:var(--muted)}
.kpi.hl{border-top:3px solid var(--accent)}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
th.num{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td .act{display:flex;gap:4px;justify-content:flex-end}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.pend{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--neg-soft);color:var(--neg)}
.pill.in{background:var(--pos-soft);color:var(--pos)}
.pill.out{background:var(--neg-soft);color:var(--neg)}
.pill.ex{background:var(--accent-soft);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input[type=search]{flex:1 1 220px}
.summary{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 12px;font-size:14px}
.summary b{font-family:var(--f-mono);font-weight:700}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}
.bar-track{grid-column:1/-1;height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--neg);border-radius:4px}
.bar-fill.alt{background:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* DRE */
.dre td,.dre th{padding:7px 10px}
.dre td:first-child{white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1}
.dre th:first-child{position:sticky;left:0;z-index:2}
.dre tr.tot td{font-weight:600;background:var(--surface-2)}
.dre tr.tot td:first-child{background:var(--surface-2)}
.dre tr.key td{font-weight:700;border-top:2px solid var(--ink)}
.dre tr.sub1 td:first-child{padding-left:26px;color:var(--muted)}
.dre td.av{color:var(--muted);font-size:12px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,12,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 12px 20px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:620px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:21px;margin-bottom:14px}
.modal.wide{max-width:1000px}
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 3;min-width:0}
.f.w6{grid-column:span 6}.f.w2{grid-column:span 2}.f.w4{grid-column:span 4}
.f label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg label{flex:1;text-align:center;padding:8px;cursor:pointer;font-weight:600;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:inherit}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
.f label.check{display:flex;font-size:14px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.loading{color:var(--muted);padding:40px 0}
.drop{border:2px dashed var(--line);border-radius:10px;padding:30px 16px;text-align:center;background:var(--surface);cursor:pointer;display:block;margin-bottom:16px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-family:var(--f-display);font-size:18px;font-weight:700;display:block;margin-bottom:4px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.cnpjbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px;font-size:14px}
.cnpjbar input{width:200px}
details.items{margin-top:6px}
details.items summary{cursor:pointer;color:var(--muted);font-size:13px}
details.items table{margin-top:6px;font-size:13px}
details.items td,details.items th{padding:5px 8px}
details.items select{max-width:260px;font-size:13px;padding:4px 6px}
.prog{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin-top:8px}
.prog>div{height:100%;background:var(--accent);transition:width .2s}
.pill.info{background:var(--surface-2);color:var(--muted)}
tr.off td{opacity:.55}
.optrow{display:flex;flex-wrap:wrap;gap:8px 20px;margin:12px 0}
.orc-acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px}
.modotab{display:inline-flex;gap:4px;padding:4px;margin-bottom:14px;border-radius:999px;background:var(--glass-bg,var(--surface));border:1px solid var(--glass-border,var(--line))}
.modotab button{font:700 14px var(--f-body);border:0;background:transparent;color:var(--muted);padding:8px 18px;border-radius:999px;cursor:pointer}
.modotab button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 12px rgba(24,168,238,.3)}
tr.clic{cursor:pointer}tr.clic:hover td{background:rgba(24,168,238,.09)}
tfoot td{border-top:2px solid var(--line);background:var(--surface-2)}
main.ro [data-act=new-lanc],main.ro [data-act=edit-lanc],main.ro [data-act=del-lanc],main.ro [data-act=pay],main.ro [data-act=unpay],main.ro [data-act=ct-batch],main.ro [data-act=new-conta],main.ro [data-act=new-cli],main.ro [data-act=edit-cli],main.ro [data-act=del-cli],main.ro [data-act=new-peca],main.ro [data-act=edit-peca],main.ro [data-act=del-peca],main.ro [data-act=imp-undo],main.ro [data-act=ent-dar],main.ro [data-act=saldo-ini],main.ro [data-act=clear-ex],main.ro [data-act=orc-new],main.ro [data-act=orc-save],main.ro [data-act=orc-del],main.ro [data-act=orc-dup],main.ro [data-act=orc-dup-cur],main.ro [data-act=os-new],main.ro [data-act=os-del],main.ro [data-act=os-del-list],main.ro [data-act=os-save],main.ro [data-act=lau-new],main.ro [data-act=lau-save],main.ro [data-act=lau-dup],main.ro [data-act=lau-del],main.ro [data-act=lau-del-list],main.ro [data-ct],main.ro #drop,main.ro a[href="#notas"].btn{display:none!important}
.nav-badge{margin-left:auto;background:var(--neg);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;line-height:1.5}
.seltab{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seltab button{font:600 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.seltab button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--accent)}
.batchbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;margin-top:12px;z-index:5}
.batchbar .btn{border-color:transparent}
.batchbar.top{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto;margin:0 0 12px}
.batchbar .btn.danger{background:#fff;color:#c62828}
td.due{white-space:nowrap}td.due .hint{white-space:nowrap}
.auth{position:fixed;inset:0;background:var(--rail);display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:70;overflow-y:auto}
.auth-wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:390px;margin:auto}
.auth-wrap>img{width:170px;height:auto;margin-bottom:22px}
.auth-card{background:var(--surface);border-radius:12px;padding:26px 24px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.auth-card h2{font-size:20px;margin:0}
.auth-card p{margin:0;font-size:14px;color:var(--muted)}
.auth-card .f{grid-column:auto}
.auth-card .btn.pri{justify-content:center;padding:11px 14px;font-size:15px}
.auth-err{background:var(--neg-soft);color:var(--neg);border-radius:6px;padding:8px 10px;font-size:14px}
.auth-foot{color:var(--rail-mute);font-size:12px;margin-top:16px;text-align:center}
.rail-foot .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rail-foot .acts button{font:600 12px var(--f-body);background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--rail-ink);border-radius:5px;padding:4px 9px;cursor:pointer}
.rail-foot .acts button:hover{border-color:var(--accent);color:#fff}
.rail-foot .tema{width:100%;margin-top:10px;text-align:left}
.tema-m{display:none;flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--rail-ink);font-size:16px;cursor:pointer}
.pwd-show{font-family:var(--f-mono);font-size:18px;font-weight:700;background:var(--surface-2);border:1px dashed var(--line);border-radius:6px;padding:10px;text-align:center;letter-spacing:.05em;user-select:all}
@media (max-width:1100px){.two,.three{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;gap:12px;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20;overflow:hidden}
  .brand small,.rail-foot,nav.menu .grp,.brand .logo{display:none}
  .tema-m{display:block}
  .brand .sym{display:block}
  nav.menu{flex-direction:row;overflow-x:auto;gap:2px;flex:1;min-width:0;scrollbar-width:none}
  nav.menu a{padding:7px 10px;border-left:0;border-bottom:3px solid transparent;border-radius:0;white-space:nowrap;font-size:14px}
  nav.menu a.on{border-bottom-color:var(--accent);background:transparent}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
  h1{font-size:28px}
  .form{grid-template-columns:1fr 1fr}
  .f,.f.w2,.f.w4{grid-column:span 1}.f.w6{grid-column:span 2}
}
@media (max-width:480px){.f,.f.w2,.f.w4{grid-column:span 2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Liquid Glass — vidro translúcido sobre fundo com as cores da marca ===== */
:root{
  --glass-bg:rgba(255,255,255,.52); --glass-bg-strong:rgba(255,255,255,.72); --glass-border:rgba(255,255,255,.75);
  --glass-edge:rgba(11,32,53,.08); --glass-shine:rgba(255,255,255,.65); --glass-shadow:0 10px 30px rgba(11,32,53,.10),0 2px 6px rgba(11,32,53,.06);
  --blob-1:rgba(24,168,238,.38); --blob-2:rgba(11,32,53,.22); --blob-3:rgba(92,196,245,.30); --blob-4:rgba(24,168,238,.18);
  --rail-glass:rgba(11,32,53,.82); --r-glass:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --glass-bg:rgba(20,40,60,.42); --glass-bg-strong:rgba(18,36,54,.78); --glass-border:rgba(255,255,255,.12);
  --glass-edge:rgba(0,0,0,.35); --glass-shine:rgba(255,255,255,.14); --glass-shadow:0 12px 36px rgba(0,0,0,.40),0 2px 6px rgba(0,0,0,.25);
  --blob-1:rgba(24,168,238,.30); --blob-2:rgba(92,196,245,.12); --blob-3:rgba(24,168,238,.18); --blob-4:rgba(120,90,255,.10);
  --rail-glass:rgba(5,15,26,.72)}}
:root[data-theme="dark"]{
  --glass-bg:rgba(20,40,60,.42); --glass-bg-strong:rgba(18,36,54,.78); --glass-border:rgba(255,255,255,.12);
  --glass-edge:rgba(0,0,0,.35); --glass-shine:rgba(255,255,255,.14); --glass-shadow:0 12px 36px rgba(0,0,0,.40),0 2px 6px rgba(0,0,0,.25);
  --blob-1:rgba(24,168,238,.30); --blob-2:rgba(92,196,245,.12); --blob-3:rgba(24,168,238,.18); --blob-4:rgba(120,90,255,.10);
  --rail-glass:rgba(5,15,26,.72)}
body{background:
  radial-gradient(38vw 38vw at 12% 8%,var(--blob-1),transparent 70%),
  radial-gradient(32vw 32vw at 92% 4%,var(--blob-3),transparent 70%),
  radial-gradient(40vw 40vw at 78% 78%,var(--blob-2),transparent 70%),
  radial-gradient(30vw 30vw at 28% 92%,var(--blob-4),transparent 70%),
  var(--bg);background-attachment:fixed}
.kpi,.panel,.tw,.banner,.drop,.modal,.auth-card,.batchbar{
  position:relative;background:var(--glass-bg);
  -webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--glass-border);border-radius:var(--r-glass);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-shine),inset 0 -1px 0 var(--glass-edge)}
.kpi::before,.panel::before,.modal::before,.auth-card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,var(--glass-shine) 0%,transparent 38%,transparent 70%,rgba(255,255,255,.06) 100%);opacity:.55}
.kpi>*,.panel>*,.modal>*,.auth-card>*{position:relative}
.kpi{transition:transform .25s ease,box-shadow .25s ease}
.kpi:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(11,32,53,.16),inset 0 1px 0 var(--glass-shine)}
.kpi.hl{border-top:1px solid var(--glass-border);box-shadow:var(--glass-shadow),inset 0 3px 0 var(--accent),inset 0 1px 0 var(--glass-shine)}
.tw{overflow:auto}
th{background:rgba(255,255,255,.10)}
tbody tr:hover td{background:rgba(24,168,238,.07)}
.modal{background:var(--glass-bg-strong)}
.ov{background:rgba(8,20,32,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.banner{border-color:var(--glass-border)}
.batchbar{background:rgba(11,32,53,.78);color:#fff}
/* trilho lateral de vidro escuro */
.rail{background:var(--rail-glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border-right:1px solid rgba(255,255,255,.08)}
nav.menu a{border-radius:12px}
nav.menu a.on{background:linear-gradient(135deg,rgba(24,168,238,.28),rgba(24,168,238,.10));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 14px rgba(24,168,238,.18)}
/* botões em pílula de vidro */
.btn{border-radius:999px;background:var(--glass-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-shine),0 2px 8px rgba(11,32,53,.06)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.pri{background:linear-gradient(180deg,#5cc6f6 0%,#18A8EE 55%,#1397d8 100%);border-color:rgba(255,255,255,.35);color:#04121F;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 18px rgba(24,168,238,.35)}
.btn.pri:hover{filter:brightness(1.05)}
.seltab button{background:var(--glass-bg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-color:var(--glass-border)}
.seltab button.on{background:var(--ink);color:var(--bg)}
input,select,textarea{background:var(--glass-bg-strong);border-color:var(--glass-border);border-radius:12px}
.bar-track{background:rgba(11,32,53,.08)}
.dre td:first-child,.dre tr.tot td:first-child{background:var(--glass-bg-strong);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.auth{background:radial-gradient(45vw 45vw at 20% 15%,rgba(24,168,238,.45),transparent 70%),radial-gradient(40vw 40vw at 85% 85%,rgba(92,196,245,.25),transparent 70%),var(--rail)}
.auth-card{background:rgba(255,255,255,.80)}

:root[data-theme="dark"] .auth-card{background:rgba(18,36,54,.72)}
/* quem pede menos transparência no sistema recebe superfícies sólidas */
@media (prefers-reduced-transparency:reduce){
  .kpi,.panel,.tw,.banner,.drop,.modal,.auth-card,.btn,.seltab button,.rail{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--surface)}
  .rail{background:var(--rail)}
}
@media (prefers-reduced-motion:reduce){.kpi:hover{transform:none}}

/* menu: grupos que abrem e fecham */
.navgrp{display:flex;flex-direction:column;margin-top:8px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.grp-t{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;color:var(--rail-ink);font:700 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:11px 12px;border-radius:14px;cursor:pointer;text-align:left}
.grp-t:hover{background:rgba(255,255,255,.05)}
.grp-t span{flex:1}.grp-t svg{transition:transform .2s ease;opacity:.75}
.grp-n{font-style:normal;background:var(--neg);color:#fff;border-radius:99px;font-size:10px;letter-spacing:0;padding:1px 6px;display:none}
.navgrp.closed .grp-t svg{transform:rotate(-90deg)}
.navgrp.closed .grp-n:not(:empty){display:inline-block}
.grp-b{display:flex;flex-direction:column;gap:2px;padding:0 6px 8px}
.navgrp.closed .grp-b{display:none}

function rebuildCats(){let custom=[];try{custom=S.categorias||[]}catch(e){}const byId=Object.fromEntries(custom.map(c=>[c.id,c]));

const fmtD = iso=>{if(!iso)return '—';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`};

function groupSums(list){
  const g={receita:0,deducoes:0,cmv:0,desp_pessoal:0,desp_adm:0,desp_com:0,desp_oper:0,rec_fin:0,desp_fin:0,invest:0};
  for(const l of list){const c=CAT[l.categoria];if(c)g[c.grupo]+=(+l.valor||0)}
  for(const k in g)g[k]=r2(g[k]);
  const recLiq=r2(g.receita-g.deducoes), lucroBruto=r2(recLiq-g.cmv);
  const despOp=r2(g.desp_pessoal+g.desp_adm+g.desp_com+g.desp_oper);
  const resOp=r2(lucroBruto-despOp), resLiq=r2(resOp+g.rec_fin-g.desp_fin);
  return {...g,recLiq,lucroBruto,despOp,resOp,resLiq};
}

function barChart(months){ // [{lbl,a,b}]
  const W=660,H=240,L=62,R=10,T=12,B=28;const iw=W-L-R, ih=H-T-B;
  const max=nice(Math.max(1,...months.flatMap(m=>[m.a,m.b])));
  const step=iw/months.length, bw=Math.min(16,step/3.2);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por mês">`;
  for(let i=0;i<=4;i++){const v=max*i/4,y=T+ih-ih*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="currentColor" font-family="var(--f-mono)">${fmtK(v)}</text>`}
  months.forEach((m,i)=>{const cx=L+step*i+step/2;const ha=ih*m.a/max, hb=ih*m.b/max;
    s+=`<rect x="${cx-bw-1}" y="${T+ih-ha}" width="${bw}" height="${ha}" rx="2" fill="var(--pos)"><title>${m.lbl} · Entradas ${fmt(m.a)}</title></rect>`;
    s+=`<rect x="${cx+1}" y="${T+ih-hb}" width="${bw}" height="${hb}" rx="2" fill="var(--neg)"><title>${m.lbl} · Saídas ${fmt(m.b)}</title></rect>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="currentColor" ${m.on?'font-weight="700" style="fill:var(--ink)"':''}>${m.lbl}</text>`});
  return s+'</svg>';
}
function lineChart(points){ // [{lbl,v,proj}]
  const W=660,H=220,L=62,R=14,T=14,B=28;const iw=W-L-R, ih=H-T-B;
  const vals=points.flatMap(p=>[p.v,p.proj]);let mx=Math.max(0,...vals),mn=Math.min(0,...vals);
  const top=nice(Math.max(1,mx)), bot=mn<0?-nice(-mn):0; const rng=top-bot;
  const y=v=>T+ih-(v-bot)/rng*ih; const x=i=>L+iw*(points.length===1?.5:i/(points.length-1));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo acumulado">`;
  for(let i=0;i<=4;i++){const v=bot+rng*i/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="currentColor" font-family="var(--f-mono)">${fmtK(v)}</text>`}
  if(bot<0)s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  const pr=points.map((p,i)=>`${x(i)},${y(p.proj)}`).join(' ');
  const pv=points.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ');
  s+=`<polygon points="${x(0)},${y(Math.max(bot,0))} ${pv} ${x(points.length-1)},${y(Math.max(bot,0))}" fill="var(--accent)" opacity=".16"/>`;
  s+=`<polyline points="${pr}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>`;
  s+=`<polyline points="${pv}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  points.forEach((p,i)=>{s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===points.length-1?4:2.5}" fill="var(--accent)"><title>${p.lbl} · Realizado ${fmt(p.v)} · Projetado ${fmt(p.proj)}</title></circle><text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="currentColor">${p.lbl}</text>`});
  return s+'</svg>';
}

function vFluxo(){
  const Y=UI.ano;
  afterHooks.push(()=>{$('#fa').onchange=e=>{UI.ano=+e.target.value;render()}});
  const start=`${Y}-01-01`;
  let saldo=r2((+S.config.saldoInicial||0)+sum(S.lancs.filter(l=>l.pago&&caixaDate(l)<start),l=>l.tipo==='entrada'?+l.valor:-l.valor));
  let projAcc=r2(sum(S.lancs.filter(l=>!l.pago&&l.data<start),l=>l.tipo==='entrada'?+l.valor:-l.valor));
  const rows=MESES.map((lbl,i)=>{const k=`${Y}-${pad(i+1)}`;
    const paid=S.lancs.filter(l=>l.pago&&caixaDate(l).startsWith(k));
    const pen=S.lancs.filter(l=>!l.pago&&inMonth(l,k));
    const rec=sum(paid.filter(l=>l.tipo==='entrada'),l=>+l.valor), pag=sum(paid.filter(l=>l.tipo==='saida'),l=>+l.valor);
    const pr=sum(pen.filter(l=>l.tipo==='entrada'),l=>+l.valor), pp=sum(pen.filter(l=>l.tipo==='saida'),l=>+l.valor);
    const ini=saldo; saldo=r2(saldo+rec-pag); projAcc=r2(projAcc+pr-pp);
    return {lbl,k,ini,rec,pag,mov:r2(rec-pag),fim:saldo,pr,pp,proj:r2(saldo+projAcc)}});
  const tot=k=>sum(rows,r=>r[k]);
  const cell=(v,cls='')=>`<td class="num ${cls} ${v<0?'neg':''}">${v?fmt(v):'<span class="muted">—</span>'}</td>`;
  const venc=S.lancs.filter(l=>!l.pago).sort((a,b)=>String(a.data||'').localeCompare(String(b.data||''))).slice(0,12);
  return `<div class="head"><div><h1>Fluxo de caixa</h1><p class="sub">Regime de caixa: entra no mês em que o dinheiro foi recebido ou pago. Contas em aberto aparecem como previsão.</p></div>
   <div class="tools">${yearPicker('fa',Y)}<button class="btn" data-act="saldo-ini">Saldo inicial: ${fmt(S.config.saldoInicial||0)}</button></div></div>
  <div class="panel" style="margin-bottom:16px"><h2>Saldo acumulado em ${Y}</h2><div class="legend"><span><i style="background:var(--accent)"></i>Realizado</span><span><i style="background:var(--muted)"></i>Projetado (com contas em aberto)</span></div>${lineChart(rows.map(r=>({lbl:r.lbl,v:r.fim,proj:r.proj})))}</div>
  <div class="tw dre" style="margin-bottom:16px"><table><thead><tr><th></th>${rows.map(r=>`<th class="num">${r.lbl}</th>`).join('')}<th class="num">Total ${Y}</th></tr></thead><tbody>
    <tr><td>Saldo inicial</td>${rows.map(r=>cell(r.ini)).join('')}${cell(rows[0].ini)}</tr>
    <tr class="sub1"><td>(+) Recebimentos</td>${rows.map(r=>cell(r.rec,'pos')).join('')}${cell(tot('rec'),'pos')}</tr>
    <tr class="sub1"><td>(−) Pagamentos</td>${rows.map(r=>cell(-r.pag)).join('')}${cell(-tot('pag'))}</tr>
    <tr class="tot"><td>Movimento do mês</td>${rows.map(r=>cell(r.mov)).join('')}${cell(tot('mov'))}</tr>
    <tr class="key"><td>Saldo final realizado</td>${rows.map(r=>cell(r.fim)).join('')}${cell(rows[11].fim)}</tr>
    <tr class="sub1"><td>A receber (previsto)</td>${rows.map(r=>cell(r.pr)).join('')}${cell(tot('pr'))}</tr>
    <tr class="sub1"><td>A pagar (previsto)</td>${rows.map(r=>cell(-r.pp)).join('')}${cell(-tot('pp'))}</tr>
    <tr class="tot"><td>Saldo final projetado</td>${rows.map(r=>cell(r.proj)).join('')}${cell(rows[11].proj)}</tr>
  </tbody></table></div>
  <div class="panel"><h2>Contas em aberto</h2>${venc.length?`<div class="tw" style="border:0"><table><thead><tr><th>Vencimento</th><th>Descrição</th><th>Status</th><th class="num">Valor</th><th></th></tr></thead><tbody>${venc.map(l=>`<tr><td>${fmtD(l.data)}</td><td>${esc(l.descricao)}<div class="hint">${esc(l.tipo==='entrada'?cliNome(l.clienteId):l.fornecedor)}</div></td><td>${statusPill(l)}</td><td class="num ${l.tipo==='entrada'?'pos':'neg'}">${l.tipo==='entrada'?'':'−'}${fmt(l.valor)}</td><td><div class="act"><button class="btn sm" data-act="pay" data-id="${l.id}">${l.tipo==='entrada'?'Receber':'Pagar'}</button></div></td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nenhuma conta em aberto.</p>'}</div>`;
}

function pecaTable(){
  const q=UI.pq.trim().toLowerCase(),qd=digits(q);
  const ls=S.pecas.filter(p=>(!q||[p.codigo,p.descricao,p.marca,p.aplicacao].join(' ').toLowerCase().includes(q)||(qd.length>=4&&(String(p.ean||'').includes(qd)||String(p.ncm||'').startsWith(qd))))&&(UI.pf!=='baixo'||estoqueBaixo(p))&&(UI.pf!=='semcusto'||!(+p.custo))&&(UI.pf!=='semvenda'||!(+p.preco)))
    .sort((a,b)=>String(a.descricao||'').localeCompare(String(b.descricao||''),'pt'));
  const vis=ls.slice(0,UI.plim);
  return `<div class="summary"><span>${ls.length} produto(s)${ls.length>vis.length?` · mostrando ${vis.length}`:''}</span></div><div class="tw"><table><thead><tr><th>Código</th><th>Descrição</th><th>NCM</th><th>Un</th><th class="num">Custo</th><th class="num">Preço venda</th><th class="num">Margem</th><th class="num">Estoque</th><th></th></tr></thead><tbody>
  ${vis.length?vis.map(p=>{const e=+p.estoque||0, mn=+p.estoqueMin||0;const mg=(+p.preco&&+p.custo)?((p.preco-p.custo)/p.preco):null;
   return `<tr><td class="num" style="text-align:left"><b>${esc(p.codigo)}</b></td><td>${esc(p.descricao)}${p.marca||p.aplicacao?`<div class="hint">${esc([p.marca,p.aplicacao].filter(Boolean).join(' · '))}</div>`:''}${p.ean?`<div class="hint">EAN ${esc(p.ean)}</div>`:''}</td><td class="hint">${esc(p.ncm||'—')}</td><td>${esc(p.unidade||'UN')}</td>
   <td class="num">${+p.custo?fmt(p.custo):'<span class="muted">—</span>'}</td><td class="num">${+p.preco?fmt(p.preco):'<span class="muted">—</span>'}</td><td class="num ${mg!==null&&mg<0?'neg':''}">${mg===null?'<span class="muted">—</span>':(mg*100).toFixed(0)+'%'}</td>
   <td class="num"><span class="pill ${mn>0?(e<=0?'late':e<=mn?'pend':'ok'):(e<0?'late':'info')}">${e} ${esc((p.unidade||'un').toLowerCase())}</span>${mn?`<div class="hint">mín. ${mn}</div>`:''}</td>
   <td><div class="act"><button class="btn sm ghost" data-act="edit-peca" data-id="${p.id}">Editar</button><button class="btn sm ghost danger" data-act="del-peca" data-id="${p.id}">Excluir</button></div></td></tr>`}).join('')
  :`<tr><td colspan="9" class="empty">${S.pecas.length?'Nenhum produto encontrado.':'Nenhum produto ainda. Clique em “+ Novo produto”.'}</td></tr>`}</tbody></table></div>
  ${ls.length>vis.length?`<p style="text-align:center;margin-top:12px"><button class="btn" data-act="p-mais">Mostrar mais ${Math.min(100,ls.length-vis.length)}</button></p>`:''}`;
}

function openModal(html,onSubmit,onMount){
  const root=$('#modal-root');root.innerHTML=`<div class="ov" id="ov"><form class="modal" id="mf" novalidate>${html}</form></div>`;
  const close=()=>{root.innerHTML='';document.removeEventListener('keydown',kd)};
  const kd=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',kd);
  $('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')close()});
  root.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
  $('#mf').addEventListener('submit',async e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.target));const btn=e.target.querySelector('[type=submit]');btn.disabled=true;
    const ok=await onSubmit(fd,e.target);btn.disabled=false;if(ok!==false)close()});
  onMount&&onMount($('#mf'));
  const first=root.querySelector('input:not([type=radio]):not([type=hidden]),select');first&&first.focus();
}

function stockEffect(l){if(!l||!l.pecaId||!l.qtd)return null;if(l.categoria==='venda_pecas')return{id:l.pecaId,d:-l.qtd};if(l.categoria==='compra_pecas')return{id:l.pecaId,d:+l.qtd};return null}
async function applyStock(changes){ // {pecaId:delta}
  for(const [id,d] of Object.entries(changes)){if(!d)continue;const p=pecaById(id);if(!p)continue;
    await S.db.doc('pecas/'+id).update({estoque:(+p.estoque||0)+d});}
}
async function saveLanc(old,doc){
  const ch={};const a=stockEffect(old.id?old:null),b=stockEffect(doc);if(a)ch[a.id]=(ch[a.id]||0)-a.d;if(b)ch[b.id]=(ch[b.id]||0)+b.d;
  const ref=old.id?S.db.doc('lancamentos/'+old.id):S.db.collection('lancamentos').doc();
  const ok=await guard((async()=>{await ref.set(doc);await applyStock(ch)})(),old.id?'Lançamento atualizado':'Lançamento salvo');
  return ok;
}

// ---------- Importação de notas fiscais (NF-e, NFC-e, NFS-e) ----------
const DTRUCK_CNPJ='53995291000161';
const digits = s=>String(s||'').replace(/\D/g,'');
const fmtDoc = d=>d.length===14?d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):d.length===11?d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4'):d;
const normCod = s=>String(s||'').trim().toUpperCase().replace(/\s+/g,'');
const safeId = s=>String(s).replace(/[^A-Za-z0-9_-]/g,'_').slice(0,190);
// CFOPs (3 últimos dígitos) que movimentam dinheiro: vendas, compras, ativo, uso e consumo, serviços
const CFOP_FIN = new Set(['101','102','103','104','105','106','107','108','109','110','111','112','113','114','115','116','117','118','119','120','122','123','124','125','126','128','401','402','403','404','405','406','407','408','551','556','653','933']);
const TPAG = {'01':'Dinheiro','02':'Cheque','03':'Cartão de crédito','04':'Cartão de débito','15':'Boleto','16':'Transferência','17':'PIX','18':'Transferência'};
const xFind = (el,name)=>{if(!el)return null;const a=el.getElementsByTagNameNS('*',name);return a.length?a[0]:null};
const xPath = (el,...ns)=>{let c=el;for(const n of ns){c=xFind(c,n);if(!c)return null}return c};
const xTxt = (el,...ns)=>{const e=xPath(el,...ns);return e?e.textContent.trim():''};
const xKids = (el,name)=>el?[...el.children].filter(c=>c.localName===name):[];
const xNum = s=>s?(parseFloat(String(s).replace(',','.'))||0):0;

function parseXmlText(xml,arquivo){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)return [{erro:'Arquivo XML inválido ou corrompido',arquivo}];
  const out=[];
  for(const ev of doc.getElementsByTagNameNS('*','infEvento')){const tp=xTxt(ev,'tpEvento');
    if(tp==='110111'||tp==='101101')out.push({kind:'cancel',chave:xTxt(ev,'chNFe')||xTxt(ev,'chNFSe'),arquivo})}
  for(const inf of doc.getElementsByTagNameNS('*','infNFe'))out.push(parseNFe(inf,doc,arquivo));
  for(const inf of doc.getElementsByTagNameNS('*','infNFSe'))out.push(parseNFSeNac(inf,arquivo));
  for(const inf of doc.getElementsByTagNameNS('*','InfNfse'))out.push(parseNFSeAbrasf(inf,arquivo));
  if(!out.length)out.push({erro:'Não é uma NF-e, NFC-e ou NFS-e reconhecida',arquivo});
  return out;
}
function parseNFe(inf,doc,arquivo){
  const ide=xKids(inf,'ide')[0], emit=xKids(inf,'emit')[0], dest=xKids(inf,'dest')[0];
  const party=e=>e?{doc:digits(xTxt(e,'CNPJ')||xTxt(e,'CPF')),nome:xTxt(e,'xNome'),fone:xTxt(e,'fone'),email:xTxt(e,'email'),cidade:xTxt(e,'xMun'),uf:xTxt(e,'UF')}:{doc:'',nome:''};
  const itens=xKids(inf,'det').map(d=>{const p=xKids(d,'prod')[0];const ean=xTxt(p,'cEAN');
    return {codigo:xTxt(p,'cProd'),ean:/^\d{8,14}$/.test(ean)?ean:'',descricao:xTxt(p,'xProd'),qtd:xNum(xTxt(p,'qCom')),unit:xNum(xTxt(p,'vUnCom')),total:xNum(xTxt(p,'vProd')),cfop:xTxt(p,'CFOP'),un:xTxt(p,'uCom')}});
  const dups=[...inf.getElementsByTagNameNS('*','dup')].map(d=>({n:xTxt(d,'nDup'),venc:xTxt(d,'dVenc'),valor:xNum(xTxt(d,'vDup'))})).filter(d=>d.valor>0);
  const cStat=xTxt(doc.documentElement,'infProt','cStat');
  return {kind:'nfe',modelo:xTxt(ide,'mod')==='65'?'NFC-e':'NF-e',chave:(inf.getAttribute('Id')||'').replace(/^NFe/,'')||xTxt(doc.documentElement,'chNFe'),
    numero:xTxt(ide,'nNF'),serie:xTxt(ide,'serie'),data:(xTxt(ide,'dhEmi')||xTxt(ide,'dEmi')).slice(0,10),tpNF:xTxt(ide,'tpNF'),finNFe:xTxt(ide,'finNFe'),natOp:xTxt(ide,'natOp'),
    emit:party(emit),dest:party(dest),itens,dups,tPag:xTxt(inf,'pag','tPag'),valor:r2(xNum(xTxt(inf,'ICMSTot','vNF'))||sum(itens,i=>i.total)),
    denegada:cStat&&!['100','150'].includes(cStat)?cStat:'',arquivo};
}
function parseNFSeNac(inf,arquivo){
  const dps=xFind(inf,'infDPS'), prest=xFind(dps,'prest'), toma=xFind(dps,'toma'), emit=xKids(inf,'emit')[0];
  const pDoc=digits(xTxt(emit,'CNPJ')||xTxt(emit,'CPF')||xTxt(prest,'CNPJ')||xTxt(prest,'CPF')), numero=xTxt(inf,'nNFSe');
  return {kind:'nfse',modelo:'NFS-e',chave:(inf.getAttribute('Id')||'').replace(/^NFS/,'')||`NFSE-${pDoc}-${numero}`,numero,serie:'',data:(xTxt(dps,'dhEmi')||xTxt(inf,'dhProc')).slice(0,10),
    emit:{doc:pDoc,nome:xTxt(emit,'xNome')||xTxt(prest,'xNome')},dest:{doc:digits(xTxt(toma,'CNPJ')||xTxt(toma,'CPF')),nome:xTxt(toma,'xNome'),fone:xTxt(toma,'fone'),email:xTxt(toma,'email'),cidade:'',uf:''},
    servico:xTxt(dps,'xDescServ'),itens:[],dups:[],tPag:'',valor:r2(xNum(xTxt(dps,'vServ'))||xNum(xTxt(inf,'vLiq'))),arquivo};
}
function parseNFSeAbrasf(inf,arquivo){
  const prest=xFind(inf,'PrestadorServico')||xFind(inf,'Prestador'), tom=xFind(inf,'TomadorServico')||xFind(inf,'Tomador');
  const pDoc=digits(xTxt(prest,'Cnpj')||xTxt(prest,'Cpf')), numero=xTxt(inf,'Numero');
  let comp=inf;while(comp&&comp.localName!=='CompNfse')comp=comp.parentNode;
  return {kind:'nfse',modelo:'NFS-e',chave:`NFSE-${pDoc}-${numero}`,numero,serie:'',data:(xTxt(inf,'DataEmissao')||xTxt(inf,'Competencia')).slice(0,10),
    emit:{doc:pDoc,nome:xTxt(prest,'RazaoSocial')},dest:{doc:digits(xTxt(tom,'Cnpj')||xTxt(tom,'Cpf')),nome:xTxt(tom,'RazaoSocial'),fone:xTxt(tom,'Telefone'),email:xTxt(tom,'Email'),cidade:'',uf:xTxt(tom,'Uf')},
    servico:xTxt(inf,'Discriminacao'),itens:[],dups:[],tPag:'',valor:r2(xNum(xTxt(inf,'ValorServicos'))||xNum(xTxt(inf,'ValorLiquidoNfse'))),
    cancelada:!!(comp&&comp.getElementsByTagNameNS('*','NfseCancelamento').length),arquivo};
}
function matchPeca(i,n){
  const cod=normCod(i.codigo);
  if(n.tipo==='saida'&&n.cp.doc){const k=n.cp.doc+':'+i.codigo;const a=S.pecas.find(p=>(p.aliases||[]).includes(k));if(a)return a.id}
  if(i.ean){const e=S.pecas.find(p=>p.ean&&p.ean===i.ean);if(e)return e.id}
  const c=S.pecas.find(p=>normCod(p.codigo)===cod);return c?c.id:'';
}
function classify(n,me){
  if(n.erro)return n;
  if(n.kind==='cancel'){const done=S.notas.find(x=>x.id===safeId(n.chave));n.status=done?'desfazer':'sem_nota';n.incluir=!!done;return n}
  const isEmit=n.emit.doc&&n.emit.doc===me, isDest=n.dest.doc&&n.dest.doc===me;
  n.tipo='';n.cp={doc:'',nome:''};
  if(isEmit){n.tipo=(n.kind==='nfe'&&n.tpNF==='0')?'saida':'entrada';n.cp=n.dest}
  else if(isDest){n.tipo='saida';n.cp=n.emit}
  if(!n.cp.nome&&!n.cp.doc)n.cp={doc:'',nome:'Consumidor final'};
  n.cfops=[...new Set(n.itens.map(i=>i.cfop).filter(Boolean))];
  const fin=n.kind==='nfse'||n.cfops.some(c=>CFOP_FIN.has(c.slice(1)));
  if(n.kind==='nfse')n.categoria=n.tipo==='entrada'?'servicos':'manutencao';
  else if(n.tipo==='entrada')n.categoria='venda_pecas';
  else if(n.cfops.length&&n.cfops.every(c=>c.endsWith('551')))n.categoria='investimento';
  else if(n.cfops.length&&n.cfops.every(c=>c.endsWith('556')))n.categoria='outras_desp';
  else n.categoria='compra_pecas';
  if(n.finNFe==='4')n.categoria=n.tipo==='saida'?'devolucoes':'outras_rec';
  const dup=S.notas.some(x=>x.id===safeId(n.chave));
  n.msg='';
  if(!n.tipo){n.status='alheia';n.msg='A Dtruck não é emitente nem destinatária'}
  else if(dup){n.status='duplicada';n.msg='Já importada antes'}
  else if(n.cancelada){n.status='cancelada';n.msg='Nota cancelada'}
  else if(n.denegada){n.status='cancelada';n.msg='Nota não autorizada (status '+n.denegada+')'}
  else if(n.finNFe==='4'){n.status='revisar';n.msg='Nota de devolução: confira antes de incluir'}
  else if(!fin){n.status='outra';n.msg='Sem efeito financeiro (CFOP '+n.cfops.join(', ')+', '+(n.natOp||'remessa')+')'}
  else n.status='nova';
  n.incluir=n.status==='nova';
  n.itens.forEach(i=>{i.map=matchPeca(i,n)||'new'});
  return n;
}
async function readFiles(files){
  const dec=buf=>{const head=new TextDecoder('ascii').decode(buf.slice(0,200));return new TextDecoder(/encoding=["']ISO-8859-1|encoding=["']windows-1252/i.test(head)?'iso-8859-1':'utf-8').decode(buf)};
  const out=[];
  for(const f of files){
    try{
      if(/\.zip$/i.test(f.name)){
        if(!window.JSZip){out.push({erro:'Não consegui abrir arquivos .zip agora. Descompacte e envie os XML.',arquivo:f.name});continue}
        const z=await JSZip.loadAsync(await f.arrayBuffer());
        for(const e of Object.values(z.files)){if(!e.dir&&/\.xml$/i.test(e.name))out.push(...parseXmlText(dec(new Uint8Array(await e.async('uint8array'))),e.name.split('/').pop()))}
      }else if(/\.xml$/i.test(f.name))out.push(...parseXmlText(dec(new Uint8Array(await f.arrayBuffer())),f.name));
      else out.push({erro:'Envie arquivos .xml ou .zip',arquivo:f.name});
    }catch(e){console.error(e);out.push({erro:'Não foi possível ler o arquivo',arquivo:f.name})}
  }
  // mesma nota em mais de um arquivo
  const seen=new Set();return out.filter(n=>{if(n.erro||n.kind==='cancel')return true;const k=n.chave;if(seen.has(k))return false;seen.add(k);return true});
}
function guessMe(list){
  const cnt={},nome={};list.forEach(n=>{if(n.erro||n.kind==='cancel')return;[n.emit,n.dest].forEach(p=>{if(p&&p.doc){cnt[p.doc]=(cnt[p.doc]||0)+1;nome[p.doc]=p.nome}})});
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];return best?{doc:best[0],nome:nome[best[0]]}:{doc:'',nome:''};
}
function reclassify(){
  const imp=UI.imp;if(!imp)return;
  imp.list.forEach(n=>classify(n,imp.me));
  // cancelamento dentro do mesmo lote
  imp.list.filter(n=>n.kind==='cancel').forEach(c=>{const t=imp.list.find(n=>n.kind!=='cancel'&&n.chave===c.chave);if(t&&t.status==='nova'){t.status='cancelada';t.msg='Cancelada (evento no mesmo lote)';t.incluir=false;c.status='junto';c.incluir=false}});
}
async function handleFiles(files){
  if(!files||!files.length)return;
  UI.imp={list:[],reading:true,me:'',meNome:'',estoque:true,clientes:true,avista:true};render();
  const list=await readFiles([...files]);
  const g=guessMe(list);
  UI.imp={list,reading:false,me:digits(S.config.cnpj)||DTRUCK_CNPJ,meNome:S.config.cnpj?(S.config.cnpjNome||''):'DTRUCK COMERCIO DE PEÇAS LTDA',guessed:false,estoque:true,clientes:true,avista:true};
  reclassify();render();
}

async function undoNota(nota){
  if(!nota)return;
  for(const id of nota.lancIds||[])await S.db.doc('lancamentos/'+id).delete();
  const back={};(nota.itens||[]).forEach(i=>{if(i.pecaId&&i.delta)back[i.pecaId]=(back[i.pecaId]||0)-i.delta});
  for(const [id,d] of Object.entries(back)){const p=pecaById(id);if(p)await S.db.doc('pecas/'+id).update({estoque:(+p.estoque||0)+d})}
  await S.db.doc('notas/'+nota.id).delete();
}
async function runImport(){
  const imp=UI.imp, me=imp.me;
  if(me.length!==14&&me.length!==11){toast('Informe o CNPJ da Dtruck antes de importar.');return}
  const todo=imp.list.filter(n=>n.incluir&&!n.erro);if(!todo.length)return;
  imp.running=true;imp.progress=0;render();
  const setProg=(i,txt)=>{imp.progress=Math.round(i/todo.length*100);imp.progressText=txt;const b=document.querySelector('.prog>div');if(b){b.style.width=imp.progress+'%';b.parentElement.previousElementSibling.textContent=txt}};
  let nOk=0,nErr=0,nCli=0,nPec=0,nUndo=0;
  try{
    if(digits(S.config.cnpj)!==me)await S.db.doc('config/geral').set({...S.config,cnpj:me,cnpjNome:imp.meNome||''}).catch(()=>{});
    const est={},alias={};S.pecas.forEach(p=>{est[p.id]=+p.estoque||0;alias[p.id]=[...(p.aliases||[])]});
    const cliByDoc={};S.clientes.forEach(c=>{const d=digits(c.documento);if(d)cliByDoc[d]=c.id});
    const novas={};
    for(let x=0;x<todo.length;x++){
      const n=todo[x];setProg(x,`${n.kind==='cancel'?'Desfazendo nota cancelada':(n.modelo+' '+n.numero)} (${x+1} de ${todo.length})`);
      try{
        if(n.kind==='cancel'){await undoNota(S.notas.find(z=>z.id===safeId(n.chave)));nUndo++;continue}
        const notaId=safeId(n.chave);
        let clienteId='';
        if(n.tipo==='entrada'&&n.cp.doc){
          if(cliByDoc[n.cp.doc])clienteId=cliByDoc[n.cp.doc];
          else if(imp.clientes){const ref=S.db.collection('clientes').doc();await ref.set({nome:n.cp.nome||fmtDoc(n.cp.doc),tipoPessoa:n.cp.doc.length===11?'PF':'PJ',documento:fmtDoc(n.cp.doc),telefone:n.cp.fone||'',email:n.cp.email||'',cidade:n.cp.cidade||'',uf:n.cp.uf||'',obs:'Cadastrado pela importação da '+n.modelo+' '+n.numero,exemplo:false,criadoEm:Date.now()});clienteId=ref.id;cliByDoc[n.cp.doc]=ref.id;nCli++}
        }
        const mexe=imp.estoque&&(n.categoria==='venda_pecas'||n.categoria==='compra_pecas');
        const touched=new Set(), itensOut=[];
        for(const i of n.itens){
          let pid='',delta=0;
          if(mexe&&i.map!=='none'){
            if(i.map==='new'){const key=(n.tipo==='saida'?n.cp.doc+':':'')+normCod(i.codigo);
              if(novas[key])pid=novas[key];
              else{const ref=S.db.collection('pecas').doc();const al=n.tipo==='saida'&&n.cp.doc?[n.cp.doc+':'+i.codigo]:[];
                await ref.set({codigo:i.codigo,descricao:i.descricao,marca:'',aplicacao:'',ean:i.ean||'',custo:n.tipo==='saida'?r2(i.unit):0,preco:n.tipo==='entrada'?r2(i.unit):0,estoque:0,estoqueMin:0,aliases:al,exemplo:false,criadoEm:Date.now()});
                pid=ref.id;novas[key]=pid;est[pid]=0;alias[pid]=al;nPec++}}
            else{pid=i.map;if(n.tipo==='saida'&&n.cp.doc){const k=n.cp.doc+':'+i.codigo;alias[pid]=alias[pid]||[];if(!alias[pid].includes(k)&&normCod(pecaById(pid)?.codigo)!==normCod(i.codigo))alias[pid].push(k)}}
            delta=(n.tipo==='entrada'?-1:1)*i.qtd;est[pid]=r2((est[pid]||0)+delta);touched.add(pid);
          }
          itensOut.push({codigo:i.codigo,descricao:i.descricao,qtd:i.qtd,unit:i.unit,total:i.total,pecaId:pid,delta});
        }
        const parcelas=n.dups.length?n.dups:[{n:'',venc:n.data,valor:n.valor}];
        const pago=!n.dups.length&&imp.avista;
        const forma=TPAG[n.tPag]||(n.dups.length?'Boleto':'PIX');
        const lancIds=[];
        // contas a pagar já criadas automaticamente quando a nota chegou da Receita: não duplicar
        const dfeDoc=S.dfe.find(x=>x.id===notaId);const lancAuto=((dfeDoc&&dfeDoc.lancAuto)||[]).filter(id=>S.lancs.some(l=>l.id===id));
        const meP=DtruckAPI.me()||{},Pm=meP.perms||{};const podeFin=meP.role==='admin'||Pm.notas==='editar'||Pm.lancamentos==='editar';
        for(let p=0;podeFin&&!lancAuto.length&&p<parcelas.length;p++){const pc=parcelas[p];const ref=S.db.collection('lancamentos').doc();
          await ref.set({tipo:n.tipo,descricao:`${n.modelo} ${n.numero} · ${n.cp.nome||'sem nome'}${parcelas.length>1?` (${p+1}/${parcelas.length})`:''}`,data:pc.venc||n.data,categoria:n.categoria,valor:r2(pc.valor),forma,
            documento:`${n.modelo} ${n.numero}${parcelas.length>1?' parc. '+(pc.n||p+1):''}`,obs:n.servico?n.servico.slice(0,300):'',pago,dataPagamento:pago?n.data:'',clienteId,fornecedor:n.tipo==='saida'?n.cp.nome:'',pecaId:'',qtd:0,notaId,exemplo:false,criadoEm:Date.now()});
          lancIds.push(ref.id)}
        for(const pid of touched){const u={estoque:est[pid]};if(alias[pid])u.aliases=alias[pid];const it=n.itens.find((i,k)=>itensOut[k].pecaId===pid);if(n.tipo==='saida'&&it&&it.unit)u.custo=r2(it.unit);await S.db.doc('pecas/'+pid).update(u)}
        await S.db.doc('notas/'+notaId).set({chave:n.chave,modelo:n.modelo,numero:n.numero,serie:n.serie||'',data:n.data,tipo:n.tipo,categoria:n.categoria,contraparte:n.cp.nome||'',contraparteDoc:n.cp.doc||'',valor:n.valor,itens:itensOut,lancIds,lancAuto,clienteId,arquivo:n.arquivo||'',importadoEm:Date.now()});
        nOk++;
      }catch(err){console.error(err);nErr++;if(err&&(err.code==='invalid_argument'||err.code==='quota_exceeded'))throw err}
    }
    setProg(todo.length,'Concluído');
    UI.imp={result:`${nOk} nota(s) importada(s)`+(nCli?`, ${nCli} cliente(s) cadastrado(s)`:'')+(nPec?`, ${nPec} produto(s) novo(s)`:'')+(nUndo?`, ${nUndo} cancelamento(s) desfeito(s)`:'')+(nErr?`. ${nErr} nota(s) com erro, tente enviar de novo.`:'.')};
  }catch(err){
    UI.imp.running=false;
    toast(err&&err.code==='invalid_argument'?'Você não tem permissão para gravar dados neste sistema.':err&&err.code==='quota_exceeded'?'Limite de armazenamento atingido.':'A importação parou por um erro. As notas já gravadas aparecem em “Notas já importadas”.');
    console.error(err);
  }
  render();
}

  const max=Math.max(1,...linhas.map(r=>r.mes)),tot=sum(linhas,r=>r.mes);

  <div class="tw"><table><thead><tr><th>Categoria</th><th>Linha da DRE</th><th class="num">${P?'Despesa':'Receita'} no mês</th><th style="width:22%">Participação</th><th class="num">${P?'Pago':'Recebido'} no mês</th><th class="num">Em aberto</th><th class="num">Vencido</th></tr></thead><tbody>
  ${linhas.length?'':`<tr><td colspan="7" class="empty">Nenhuma conta neste mês. Marque “Mostrar categorias sem movimento” para ver todas.</td></tr>`}${linhas.map(r=>`<tr class="clic" data-act="cat-ver" data-t="${tipo}" data-id="${r.id}" title="Ver as contas desta categoria"><td><b>${r.c?esc(r.c.nome):'Sem categoria'}</b>${r.c&&r.c.ativo===false?' <span class="pill info">Desativada</span>':''}</td><td class="hint">${r.c?esc(GRUPOS[r.c.grupo]||''):'—'}</td>
    <td class="num ${P?'neg':'pos'}"><b>${fmt(r.mes)}</b></td><td><div class="bar-track"><div class="bar-fill ${P?'':'alt'}" style="width:${r.mes/max*100}%"></div></div><span class="hint">${tot?(r.mes/tot*100).toFixed(0):0}%</span></td>
    <td class="num">${fmt(r.pg)}</td><td class="num">${r.ab?fmt(r.ab)+`<div class="hint">${r.nab} conta(s)</div>`:'—'}</td><td class="num ${r.venc?'neg':''}">${r.venc?fmt(r.venc):'—'}</td></tr>`).join('')}
  </tbody><tfoot><tr><td><b>Total</b></td><td></td><td class="num"><b>${fmt(tot)}</b></td><td></td><td class="num"><b>${fmt(sum(linhas,r=>r.pg))}</b></td><td class="num"><b>${fmt(sum(linhas,r=>r.ab))}</b></td><td class="num neg"><b>${fmt(sum(linhas,r=>r.venc))}</b></td></tr></tfoot></table></div>`;
}

function chaveValida(ch){if(!/^\d{44}$/.test(ch))return false;let s=0,w=2;for(let i=42;i>=0;i--){s+=+ch[i]*w;w=w===9?2:w+1}const r=s%11;return (r<2?0:11-r)===+ch[43]}
const chaveNum=ch=>({cnpj:ch.slice(6,20),serie:String(+ch.slice(22,25)),numero:String(+ch.slice(25,34)),mod:ch.slice(20,22)});
const notaImportada=ch=>S.notas.find(n=>n.id===ch||n.chave===ch);
function entradasPendentes(){return S.dfe.filter(d=>d.status==='completa'&&d.situacao!=='cancelada'&&!notaImportada(d.id))}
UI.ent={msg:null,todas:false};
function entMsg(tipo,html){UI.ent.msg={tipo,html};render();setTimeout(()=>{const i=$('#ent-chave');if(i){i.value='';i.focus()}},30)}
async function darEntrada(ch){
  let xml;
  try{xml=(await DtruckAPI.getXml(ch)).xml}catch(e){return entMsg('neg','Não consegui buscar o XML desta nota agora: '+esc(e.message||'erro')+'. Tente de novo.')}
  const list=parseXmlText(xml,'Receita '+ch.slice(-8)+'.xml');
  UI.imp={list,reading:false,me:digits(S.config.cnpj)||DTRUCK_CNPJ,meNome:S.config.cnpjNome||'DTRUCK COMERCIO DE PEÇAS LTDA',guessed:false,estoque:true,clientes:true,avista:true};
  reclassify();UI.ent.msg=null;location.hash='#notas';
}
async function lerChave(raw){
  if(!can('entrada','editar'))return entMsg('neg','Você só tem permissão para consultar esta tela.');
  const ch=digits(raw);
  if(ch.length!==44)return entMsg('neg','A chave de acesso tem 44 números. Confira e tente de novo.');
  if(!chaveValida(ch))return entMsg('neg','Esta chave não é válida (dígito verificador não confere). Bipe de novo ou confira a digitação.');
  const info=chaveNum(ch), me=digits(S.config.cnpj)||DTRUCK_CNPJ;
  const imp=notaImportada(ch);
  if(imp)return entMsg('ok',`A NF ${esc(info.numero)} já deu entrada${imp.importadoEm?' em '+new Date(imp.importadoEm).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):''}. Nada foi alterado.`);
  if(info.cnpj===me)return entMsg('pend','Esta nota foi emitida pela própria Dtruck. Para vendas, use <a href="#notas">Importar notas</a>.');
  const d=S.dfe.find(x=>x.id===ch);
  if(d&&d.situacao==='cancelada')return entMsg('neg',`A NF ${esc(info.numero)} de ${esc(d.emitNome||fmtDoc(info.cnpj))} foi <b>cancelada</b> pelo fornecedor. Não dê entrada.`);
  if(d&&d.status==='completa')return darEntrada(ch);
  if(d&&d.cienciaRecusada)return entMsg('pend',`A NF ${esc(info.numero)} de ${esc(d.emitNome||fmtDoc(info.cnpj))} tem mais de 10 dias, e a Receita só entrega o resumo dela. Para dar entrada, importe o XML da nota (enviado pelo fornecedor ou baixado do LocControl) em <a href="#notas">Importar notas</a>.`);
  if(d)return entMsg('pend',`A Receita já informou a NF ${esc(info.numero)} de ${esc(d.emitNome||fmtDoc(info.cnpj))}. A ciência foi registrada e o XML completo chega na próxima consulta (até 1 hora). Bipe de novo depois.`);
  const f=S.dfefila.find(x=>x.id===ch);
  if(f)return entMsg('pend',`Esta nota já foi pedida à Receita.${f.resposta?' Última resposta: '+esc(f.resposta):' Aguardando a próxima consulta (até 1 hora).'}`);
  try{await S.db.doc('dfefila/'+ch).set({pedidoEm:Date.now(),por:(DtruckAPI.me()||{}).email||'',cnpj:info.cnpj,numero:info.numero})}
  catch(e){return entMsg('neg','Não consegui registrar o pedido: '+esc(e.message||'erro'))}
  entMsg('pend',`NF ${esc(info.numero)} (CNPJ ${fmtDoc(info.cnpj)}) pedida à Receita. Ela aparece na lista abaixo em até 1 hora, pronta para dar entrada.`);
}
function vEntrada(){
  afterHooks.push(()=>{const i=$('#ent-chave');if(!i)return;i.focus();
    // o leitor de código de barras "digita" a chave e aperta Enter: processa uma vez só
    const go=()=>{const v=digits(i.value);if(!v)return;const k=v+'|'+Math.floor(Date.now()/1500);if(UI.ent.last===k)return;UI.ent.last=k;lerChave(v)};
    i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
    i.addEventListener('input',()=>{if(digits(i.value).length===44)go()});
    const t=$('#ent-todas');if(t)t.onchange=()=>{UI.ent.todas=t.checked;render()};
  });
  const st=S.sys.find(x=>x.id==='dfe');
  const quando=st&&st.ultimaConsulta?new Date(st.ultimaConsulta).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'';
  const fila=S.dfefila.filter(f=>!S.dfe.some(d=>d.id===f.id&&d.status==='completa'));
  const rows=[...S.dfe.map(d=>({d,ch:d.id,imp:notaImportada(d.id)})),...fila.filter(f=>!S.dfe.some(d=>d.id===f.id)).map(f=>({f,ch:f.id}))]
    .filter(r=>UI.ent.todas||!(r.imp))
    .sort((a,b)=>String((b.d&&b.d.dhEmi)||'').localeCompare(String((a.d&&a.d.dhEmi)||''))||(b.f?1:0)-(a.f?1:0));
  const pill=r=>{if(r.f)return '<span class="pill info">Pedida à Receita</span>';const d=r.d;
    if(d.situacao==='cancelada')return '<span class="pill late">Cancelada</span>';
    if(r.imp)return '<span class="pill ok">Entrada feita</span>';
    if(d.status==='completa')return '<span class="pill in">Pronta para entrada</span>';
    if(d.cienciaRecusada)return '<span class="pill info" title="A Receita só libera o XML completo até 10 dias após a emissão">Só resumo</span>';
    return '<span class="pill pend">Aguardando XML</span>'};
  const M=UI.ent.msg;
  const msgCls={ok:'background:var(--pos-soft);border-color:var(--pos)',neg:'background:var(--neg-soft);border-color:var(--neg)',pend:''};
  return `<div class="head"><div><h1>Entrada de mercadoria</h1><p class="sub">Notas que os fornecedores emitiram contra o CNPJ da Dtruck, baixadas da Receita de hora em hora com o certificado digital.</p></div></div>
  ${certPanel()}
  <div class="panel" style="margin-bottom:16px">
    <label for="ent-chave" style="font-weight:700;display:block;margin-bottom:8px">Bipe o código de barras do DANFE ou digite a chave de acesso</label>
    <input id="ent-chave" inputmode="numeric" autocomplete="off" placeholder="44 números da chave de acesso" style="width:100%;font-size:18px;padding:12px 14px;font-family:var(--f-mono);letter-spacing:.04em">
    <p class="hint" style="margin:8px 0 0">Com leitor de código de barras, basta apontar para o código do DANFE. Notas prontas abrem direto a conferência dos itens.</p>
  </div>
  ${M?`<div class="banner" style="${msgCls[M.tipo]||''}"><span>${M.html}</span><button class="btn sm" data-act="ent-ok">OK</button></div>`:''}
  <div class="summary"><span>${st?`Última consulta à Receita: <b>${quando}</b> ${st.ok?'<span class="pill ok">OK</span>':'<span class="pill late">Com problema</span>'}`:'<span class="pill pend">O robô da Receita ainda não rodou</span>'}</span>${st&&st.ultimoStatus?`<span class="muted">${esc(st.ultimoStatus)}</span>`:''}</div>
  <div class="filters"><label class="check"><input type="checkbox" id="ent-todas" ${UI.ent.todas?'checked':''}> Mostrar também as notas que já deram entrada</label></div>
  ${rows.length?`<div class="tw"><table><thead><tr><th>Emissão</th><th>Nota</th><th>Fornecedor</th><th class="num">Valor</th><th>Situação</th><th></th></tr></thead><tbody>${rows.map(r=>{const i=chaveNum(r.ch),d=r.d||{};
    return `<tr><td>${d.dhEmi?fmtD(d.dhEmi.slice(0,10)):'—'}</td><td><b>NF ${esc(i.numero)}</b><div class="hint">Série ${esc(i.serie)}</div></td><td>${esc(d.emitNome||'')||'<span class="muted">Aguardando dados</span>'}<div class="hint">${fmtDoc(d.emitCnpj||i.cnpj)}</div>${r.f&&r.f.resposta?`<div class="hint">${esc(r.f.resposta)}</div>`:''}</td>
    <td class="num">${d.valor?fmt(d.valor):'—'}</td><td>${pill(r)}</td>
    <td><div class="act">${r.d&&d.status==='completa'&&!r.imp&&d.situacao!=='cancelada'?`<button class="btn sm pri" data-act="ent-dar" data-id="${r.ch}">Dar entrada</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`
  :`<p class="panel empty">${S.dfe.length?'Todas as notas recebidas já deram entrada.':'Nenhuma nota de fornecedor recebida ainda. Quando o robô da Receita rodar, as notas emitidas contra a Dtruck aparecem aqui.'}</p>`}`;
}

function loadForge(){return new Promise(r=>{if(window.forge)return r(true);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js';s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)})}
async function copiar(txt,okMsg,fallbackEl){try{await navigator.clipboard.writeText(txt);toast(okMsg)}catch(e){if(fallbackEl){fallbackEl.hidden=false;fallbackEl.value=txt;fallbackEl.select()}toast('Selecione o texto destacado e copie com Ctrl+C.')}}

UI.cert={b64:'',pass:''};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='cert-check'){
    const f=$('#cert-file').files[0], pass=$('#cert-pass').value, out=$('#cert-res');
    if(!f){toast('Escolha o arquivo do certificado.');return}
    const bytes=new Uint8Array(await f.arrayBuffer());let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
    UI.cert={b64:btoa(bin),pass};
    let info='';
    if(await loadForge()){
      try{const p12=forge.pkcs12.pkcs12FromAsn1(forge.asn1.fromDer(bin),false,pass);
        const certs=(p12.getBags({bagType:forge.pki.oids.certBag})[forge.pki.oids.certBag]||[]).map(x=>x.cert);
        const keyOk=((p12.getBags({bagType:forge.pki.oids.pkcs8ShroudedKeyBag})[forge.pki.oids.pkcs8ShroudedKeyBag]||[]).length+(p12.getBags({bagType:forge.pki.oids.keyBag})[forge.pki.oids.keyBag]||[]).length)>0;
        const c=certs.find(x=>!(x.extensions||[]).some(ex=>ex.name==='basicConstraints'&&ex.cA))||certs[0];
        const cn=c?(c.subject.getField('CN')||{}).value||'':'', ate=c?c.validity.notAfter:null, dias=ate?Math.floor((ate-Date.now())/864e5):0;
        const cnpjOk=digits(cn).includes(digits(S.config.cnpj)||DTRUCK_CNPJ);
        info=`<div class="banner" style="background:var(--pos-soft);border-color:var(--pos);margin:0;flex-direction:column;align-items:flex-start"><b>Senha correta.</b><span>Certificado: ${esc(cn)}</span><span>Válido até ${ate?ate.toLocaleDateString('pt-BR'):'—'} (${dias} dias)${dias<30?' <b class="neg">— vence em breve</b>':''}</span>${keyOk?'':'<span class="neg">Atenção: este arquivo não tem a chave privada. Exporte o certificado de novo marcando “exportar a chave privada”.</span>'}${cnpjOk?'':'<span class="neg">Atenção: o CNPJ deste certificado não é o da Dtruck.</span>'}</div>`;
      }catch(x){out.hidden=false;out.innerHTML='<div class="banner" style="background:var(--neg-soft);border-color:var(--neg);margin:0">Não consegui abrir o certificado: a <b>senha está errada</b> ou o arquivo não é um certificado A1 (.pfx). Confira e tente de novo.</div>';return}

// ---------- Utilidades de cadastro (CPF/CNPJ/CEP) ----------
function cpfOk(c){c=digits(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(const t of [9,10]){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);if(((s*10)%11)%10!==+c[t])return false}return true}
function cnpjOk(c){c=digits(c);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const calc=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)===+c[12]&&calc(13)===+c[13]}
const fmtCep=c=>{c=digits(c);return c.length===8?c.slice(0,5)+'-'+c.slice(5):c};
const fmtFone=t=>{t=digits(t);if(t.length===11)return `(${t.slice(0,2)}) ${t.slice(2,7)}-${t.slice(7)}`;if(t.length===10)return `(${t.slice(0,2)}) ${t.slice(2,6)}-${t.slice(6)}`;return t};
async function buscaCep(cep){const r=await fetch('https://viacep.com.br/ws/'+digits(cep)+'/json/');if(!r.ok)throw new Error('CEP não encontrado');const j=await r.json();if(j.erro)throw new Error('CEP não encontrado');return {logradouro:j.logradouro||'',bairro:j.bairro||'',cidade:j.localidade||'',uf:j.uf||'',complemento:j.complemento||''}}
async function buscaCnpj(cnpj){const r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+digits(cnpj));if(!r.ok)throw new Error(r.status===404?'CNPJ não encontrado na Receita':'Consulta indisponível agora');const j=await r.json();
  return {nome:j.razao_social||'',fantasia:j.nome_fantasia||'',cep:j.cep?fmtCep(String(j.cep)):'',logradouro:[j.descricao_tipo_de_logradouro,j.logradouro].filter(Boolean).join(' '),numero:j.numero||'',complemento:j.complemento||'',bairro:j.bairro||'',cidade:j.municipio||'',uf:j.uf||'',telefone:j.ddd_telefone_1?fmtFone(j.ddd_telefone_1):'',email:(j.email||'').toLowerCase(),situacao:j.descricao_situacao_cadastral||''}}
const endLinha=c=>[[c.logradouro,c.numero].filter(Boolean).join(', '),c.complemento,c.bairro,[c.cidade,c.uf].filter(Boolean).join('/'),c.cep?'CEP '+fmtCep(c.cep):''].filter(Boolean).join(' · ');

    .sort((a,b)=>String(b.entrada||'').localeCompare(String(a.entrada||'')));
  return `<div class="tw"><table><thead><tr><th>OS</th><th>Entrada</th><th>Caminhão</th><th>Cliente</th><th>Serviço</th><th>Situação</th><th>Saída</th><th class="num">Total</th><th></th></tr></thead><tbody>

    <td><b>${esc(placaFmt(v.placa))||'—'}</b><div class="hint">${esc([v.marca,v.modelo,v.ano].filter(Boolean).join(' '))}${v.frota?' · frota '+esc(v.frota):''}</div></td>
    <td>${esc(o.clienteNome)||'<span class="muted">—</span>'}</td><td style="max-width:240px"><div class="hint" style="color:var(--ink)">${esc(String(o.relato||o.diagnostico||'').slice(0,90))||'—'}</div></td>

    <td class="num"><b>${fmt(t.total)}</b></td><td><div class="act"><button class="btn sm" data-act="os-open" data-id="${o.id}">Abrir</button><button class="btn sm ghost" data-act="os-print" data-id="${o.id}">Imprimir</button>${can('os','editar')?`<button class="btn sm ghost danger" data-act="os-del-list" data-id="${o.id}">Excluir</button>`:''}</div></td></tr>`}).join('')

function osNova(pre){
  const id=S.db.collection('os').doc().id;
  UI.os.edit={id,_novo:true,numero:'',status:'aberta',entrada:agoraLocal(),previsao:'',saida:'',clienteId:'',clienteNome:'',veiculo:{placa:'',marca:'',modelo:'',ano:'',km:'',frota:'',chassi:''},
    relato:'',diagnostico:'',mecanico:'',servicos:[{desc:'',horas:'',valor:''}],pecas:[],desconto:'',obs:'',faturado:null,...(pre||{})};

function osTotHtml(o){const t=osTot(o);return `<div class="li"><span>Serviços</span><span class="num">${fmt(t.sv)}</span></div><div class="li"><span>Produtos</span><span class="num">${fmt(t.pc)}</span></div>${t.de?`<div class="li"><span>Desconto</span><span class="num neg">−${fmt(t.de)}</span></div>`:''}<div class="li" style="font-size:18px"><b>Total</b><b class="num">${fmt(t.total)}</b></div>`}
function osLimpo(o){const c=JSON.parse(JSON.stringify(o));delete c.id;delete c._novo;c.veiculo=c.veiculo||{};c.veiculo.placa=placaFmt(c.veiculo.placa);c.veiculo.chassi=String(c.veiculo.chassi||'').toUpperCase();
  c.servicos=(c.servicos||[]).filter(s=>String(s.desc||'').trim()||+s.valor).map(s=>({desc:String(s.desc||'').trim(),horas:s.horas||'',valor:r2(+String(s.valor).replace(',','.')||0)}));
  c.pecas=(c.pecas||[]).filter(p=>p.pecaId||String(p.desc||'').trim()).map(p=>({pecaId:p.pecaId||'',codigo:p.codigo||'',desc:String(p.desc||'').trim(),qtd:+String(p.qtd).replace(',','.')||0,unit:r2(+String(p.unit).replace(',','.')||0)}));
  c.desconto=r2(+String(c.desconto||0).replace(',','.')||0);const cl=S.clientes.find(x=>x.id===c.clienteId);c.clienteNome=cl?cl.nome:(c.clienteNome||'');c.total=osTot(c).total;c.atualizadoEm=Date.now();c.criadoEm=c.criadoEm||Date.now();return c}
async function osSalvar(silencioso){const o=UI.os.edit;if(!placaFmt(o.veiculo&&o.veiculo.placa)&&!o.clienteId){toast('Informe pelo menos a placa ou o cliente.');return false}
  if(!o.numero){try{o.numero=(await DtruckAPI.proximoNumero('os')).numero}catch(e){toast(e.message||'Não consegui gerar o número da OS.');return false}}
  const d=osLimpo(o);const ok=await guard(S.db.doc('os/'+o.id).set(d),silencioso?null:'OS '+o.numero+' salva');if(ok){UI.os.edit={...d,id:o.id};UI.os.dirty=false;render()}return ok}
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.osf||!UI.os.edit)return;
  let v=el.value;setPath(UI.os.edit,el.dataset.osf,v);UI.os.dirty=true;
  if(el.dataset.num||el.dataset.osf.startsWith('pecas.')){const m=el.dataset.osf.match(/^pecas\.(\d+)\./);if(m){const p=UI.os.edit.pecas[+m[1]];const c=$('#os-sub-'+m[1]);if(c)c.textContent=fmt((+String(p.qtd).replace(',','.')||0)*(+String(p.unit).replace(',','.')||0))}
    const t=$('#os-tot');if(t)t.innerHTML=osTotHtml(osLimpoTot(UI.os.edit))}});
const osLimpoTot=o=>({...o,servicos:(o.servicos||[]).map(s=>({...s,valor:+String(s.valor).replace(',','.')||0})),pecas:(o.pecas||[]).map(p=>({...p,qtd:+String(p.qtd).replace(',','.')||0,unit:+String(p.unit).replace(',','.')||0})),desconto:+String(o.desconto||0).replace(',','.')||0});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset||!UI.os.edit)return;
  if(el.dataset.peca!==undefined){const i=+el.dataset.peca,p=UI.os.edit.pecas[i],pc=pecaById(el.value);p.pecaId=el.value;if(pc){p.codigo=pc.codigo;p.desc=pc.descricao;p.unit=pc.preco||p.unit;if(!+p.qtd)p.qtd=1}render()}
  else if(el.dataset.osf==='status'||el.dataset.osf==='clienteId'){setPath(UI.os.edit,el.dataset.osf,el.value);UI.os.dirty=true}});
async function osFaturar(){const o=UI.os.edit,t=osTot(osLimpo(o));if(!(t.total>0)){toast('A OS está sem valor para faturar.');return}
  if(!o.clienteId){toast('Escolha o cliente antes de faturar.');return}
  openModal(`<h2>Faturar OS ${esc(o.numero)}</h2><p>Total <b>${fmt(t.total)}</b>. As parcelas entram em Contas a receber${(o.pecas||[]).some(p=>p.pecaId)?' e os produtos do estoque recebem baixa':''}.</p><div class="form">
    <div class="f w2"><label for="fa-n">Parcelas</label><select id="fa-n" name="n">${[1,2,3,4,5,6,8,10,12].map(n=>`<option>${n}</option>`).join('')}</select></div>
    <div class="f w2"><label for="fa-v">1º vencimento</label><input id="fa-v" type="date" name="venc" value="${today}"></div>
    <div class="f w2"><label for="fa-i">Intervalo (dias)</label><input id="fa-i" type="number" name="int" value="30" min="1"></div>
    <div class="f w3"><label for="fa-f">Forma</label><select id="fa-f" name="forma">${FORMAS.map(f=>`<option ${f==='Boleto'?'selected':''}>${f}</option>`).join('')}</select></div>
    <div class="f w3"><label class="check" style="margin-top:22px"><input type="checkbox" name="pago"> Já recebido (pagamento à vista)</label></div>
  </div><div class="mfoot"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn pri">Faturar</button></div>`,async d=>{
    if(!await osSalvar(true))return false;const o=UI.os.edit;const n=+d.n||1,tot=o.total,base=Math.floor(tot/n*100)/100,ids=[];
    const ok=await guard((async()=>{
      for(let i=0;i<n;i++){const ref=S.db.collection('lancamentos').doc();const venc=addDias(d.venc||today,(+d.int||30)*i);const val=i===n-1?r2(tot-base*(n-1)):base;
        await ref.set({tipo:'entrada',descricao:`OS ${o.numero} · ${placaFmt(o.veiculo.placa)} · ${o.clienteNome}${n>1?` (${i+1}/${n})`:''}`,data:venc,categoria:'servicos',valor:val,forma:d.forma,documento:'OS '+o.numero+(n>1?' parc. '+(i+1):''),obs:'',
          pago:!!d.pago,dataPagamento:d.pago?today:'',clienteId:o.clienteId,fornecedor:'',pecaId:'',qtd:0,osId:o.id,exemplo:false,criadoEm:Date.now()});ids.push(ref.id)}
      const baixas=[];for(const p of o.pecas||[]){const pc=p.pecaId&&pecaById(p.pecaId);if(pc&&p.qtd){await S.db.doc('pecas/'+pc.id).update({estoque:(+pc.estoque||0)-p.qtd});baixas.push({pecaId:pc.id,qtd:p.qtd})}}
      await S.db.doc('os/'+o.id).update({faturado:{em:today,lancIds:ids,baixas}});UI.os.edit.faturado={em:today,lancIds:ids,baixas};
    })(),'OS faturada');if(ok)render();return ok});
}
async function osDesfaturar(){const o=UI.os.edit,f=o.faturado;const pagos=(f.lancIds||[]).filter(id=>S.lancs.find(l=>l.id===id&&l.pago));
  if(pagos.length){toast(`${pagos.length} parcela(s) já recebida(s). Estorne o recebimento em Contas a receber antes.`);return}
  confirmBox('Desfazer faturamento',`Apagar as ${(f.lancIds||[]).length} parcela(s) em aberto e devolver os produtos ao estoque?`,'Desfazer',async()=>{
    const ok=await guard((async()=>{for(const id of f.lancIds||[])await S.db.doc('lancamentos/'+id).delete();
      for(const b of f.baixas||[]){const pc=pecaById(b.pecaId);if(pc)await S.db.doc('pecas/'+pc.id).update({estoque:(+pc.estoque||0)+b.qtd})}
      await S.db.doc('os/'+o.id).update({faturado:null});UI.os.edit.faturado=null})(),'Faturamento desfeito');if(ok)render()})}
function osExcluir(o,noEditor){if(!o)return;const f=o.faturado;
  const pagos=f?(f.lancIds||[]).filter(id=>S.lancs.find(l=>l.id===id&&l.pago)).length:0;
  if(pagos){toast(`A OS ${o.numero} tem ${pagos} parcela(s) já recebida(s). Estorne o recebimento em Contas a receber antes de excluir.`);return}
  confirmBox('Excluir OS',`Excluir a OS ${esc(o.numero)}${o.veiculo&&o.veiculo.placa?' ('+esc(placaFmt(o.veiculo.placa))+')':''}?${f?' As parcelas em aberto em Contas a receber serão apagadas e os produtos voltam para o estoque.':''} Isso não pode ser desfeito.`,'Excluir',async()=>{
    const ok=await guard((async()=>{if(f){for(const id of f.lancIds||[])await S.db.doc('lancamentos/'+id).delete();
      for(const bx of f.baixas||[]){const pc=pecaById(bx.pecaId);if(pc)await S.db.doc('pecas/'+pc.id).update({estoque:(+pc.estoque||0)+bx.qtd})}}
      await S.db.doc('os/'+o.id).delete()})(),'OS excluída');if(ok&&noEditor){UI.os.edit=null;UI.os.dirty=false}if(ok)render()})}

async function comprimirFoto(file){const img=await createImageBitmap(file,{imageOrientation:'from-image'});let w=img.width,h=img.height,M=1400;
  const draw=(m,q)=>{const k=Math.min(1,m/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)};
  let q=.78,url=draw(M,q);while(url.length>230000&&q>.4){q-=.1;url=draw(M,q)}while(url.length>230000&&M>500){M=Math.round(M*.8);url=draw(M,.6)}return url}
